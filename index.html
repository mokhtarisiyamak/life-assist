// 9b. ACHIEVEMENTS SYSTEM (Phase 3)
// ==========================================================
function checkAchievements() {
  const today = new Date();
  const trackedDates = Object.keys(appData.habits).filter(d => Object.keys(appData.habits[d]).length > 0);
  const totalDays = trackedDates.length;
  let bestStreak = 0, cur = 0;
  for (let i = 0; i < 365; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (Object.keys(hd).length > 0) { cur++; if (cur > bestStreak) bestStreak = cur; }
    else cur = 0;
  }
  // Total exercise minutes
  let totalExercise = 0, totalCigarettes = 0, totalWater = 0;
  trackedDates.forEach(ds => {
    const hd = appData.habits[ds] || {};
    if (hd.exercise) totalExercise += hd.exercise.minutes || 0;
    if (hd.smoking) totalCigarettes += hd.smoking.count || 0;
    if (hd.water) totalWater += hd.water.count || 0;
  });
  // Perfect days (score >= 90)
  let perfectDays = trackedDates.filter(d => calcDayScore(appData.habits[d]) >= 90).length;
  // Smoking free days
  let smokeFreeDays = trackedDates.filter(d => {
    const hd = appData.habits[d] || {};
    return hd.smoking && hd.smoking.count === 0;
  }).length;

  return [
    { id: 'first-day', icon: '🌱', name: 'اولین قدم', desc: 'اولین روز ثبت', unlocked: totalDays >= 1 },
    { id: 'week-streak', icon: '🔥', name: 'استریک یک هفته', desc: '۷ روز متوالی ثبت', unlocked: bestStreak >= 7 },
    { id: 'month-streak', icon: '💪', name: 'استریک یک ماه', desc: '۳۰ روز متوالی ثبت', unlocked: bestStreak >= 30 },
    { id: 'perfect-day', icon: '⭐', name: 'روز بی‌نقص', desc: 'امتیاز ۹۰+ در یک روز', unlocked: perfectDays >= 1 },
    { id: '100-hours', icon: '🏃', name: 'صد ساعت ورزش', desc: 'مجموع ۱۰۰ ساعت ورزش', unlocked: totalExercise >= 6000 },
    { id: 'smoke-free', icon: '🚭', name: 'بدون سیگار', desc: '۷ روز بدون سیگار', unlocked: smokeFreeDays >= 7 },
    { id: 'data-lover', icon: '📊', name: 'عاشق داده', desc: '۶۰ روز ثبت', unlocked: totalDays >= 60 }
  ];
}

function copyPrompt(textOrEl) {
  // Support both direct text string and element (for backward compat)
  let text;
  if (typeof textOrEl === 'string') {
    text = textOrEl;
  } else if (textOrEl && textOrEl.dataset) {
    text = textOrEl.dataset.promptText;
  } else if (textOrEl) {
    text = textOrEl.querySelector('.prompt-text')?.textContent;
  }
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    toast('📋 پرامپت کپی شد', 'success');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('📋 پرامپت کپی شد', 'success');
  });
}

function clearAllData() {

// ===== SETTINGS HANDLER FUNCTIONS =====

function updateCategory(key, field, value) {
  if (!appData.settings.customCategories[key]) {
    appData.settings.customCategories[key] = { ...HEALTH_CATEGORIES[key], isDefault: false };
  }
  appData.settings.customCategories[key][field] = value;
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function addCategory() {
  const key = 'custom' + Date.now();
  appData.settings.customCategories[key] = {
    name: 'دسته جدید',
    icon: '⭐',
    color: '#39d0d8',
    weight: 10,
    isDefault: false
  };
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function deleteCategory(keyOrParams) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  if (HEALTH_CATEGORIES[key]?.isDefault) return; // Can't delete defaults
  if (!confirm('این دسته حذف شود؟ عادت‌های آن به دسته "رشد" منتقل می‌شوند.')) return;

  // Reassign habits to growth category
  for (const hKey of Object.keys(HABIT_DEFS)) {
    if (HABIT_DEFS[hKey].category === key) {
      if (appData.settings.customHabits[hKey]) {
        appData.settings.customHabits[hKey].category = 'growth';
      }
    }
  }
  delete appData.settings.customCategories[key];
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function updateHabit(key, field, value) {
  if (!appData.settings.customHabits[key]) {
    // Clone default habit
    appData.settings.customHabits[key] = { ...HABIT_DEFS[key], isDefault: false };
  }
  appData.settings.customHabits[key][field] = value;
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function toggleHabitArchive(keyOrParams, archived) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  const def = HABIT_DEFS[key];
  if (!def) return;

  if (def.isDefault) {
    if (!appData.settings.customHabits[key]) {
      appData.settings.customHabits[key] = { ...def };
    }
    appData.settings.customHabits[key].archived = archived;
  } else {
    if (appData.settings.customHabits[key]) {
      appData.settings.customHabits[key].archived = archived;
    }
  }
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function updateGoal(key, value) {
  const def = HABIT_DEFS[key];
  if (!def) return;

  const parsed = (def.unit === 'time' || def.unit === 'quality') ? value : parseInt(value);
  if (isNaN(parsed) && def.unit !== 'time') return;

  if (!appData.settings.goals.custom) appData.settings.goals.custom = {};
  appData.settings.goals.custom[key] = {
    target: parsed,
    unit: def.unit,
    label: def.name
  };
  saveAll();
  renderSettings();
  renderDashboard();
}

function addCustomGoal() {
  // Show a modal to pick a custom habit and set its target
  const eligible = Object.entries(HABIT_DEFS).filter(([k, def]) =>
    def && !def.isDefault && !def.archived && def.unit !== 'boolean'
  );
  if (eligible.length === 0) {
    toast('عادت سفارشی با واحد عددی یا زمانی برای تعریف هدف وجود ندارد', 'info');
    return;
  }

  document.getElementById('modal-title').textContent = '🎯 هدف برای عادت سفارشی';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group">
      <label>عادت</label>
      <select id="goal-habit-select">
        ${eligible.map(([k, def]) => `<option value="${k}">${def.icon} ${escapeHtml(def.name)}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>مقدار هدف</label>
      <input type="number" id="goal-target-input" min="0" step="1" placeholder="مثال: 20">
    </div>
  `;
  document.getElementById('modal-left-actions').innerHTML = '';

  const syncTargetInput = () => {
    const key = document.getElementById('goal-habit-select').value;
    const def = HABIT_DEFS[key];
    const input = document.getElementById('goal-target-input');
    if (!def || !input) return;
    const current = getHabitTarget(key);
    if (def.unit === 'time' || def.unit === 'quality') {
      input.type = 'time';
      input.removeAttribute('min');
      input.removeAttribute('step');
      input.value = (typeof current === 'string' && current) ? current : (def.unit === 'quality' ? '23:00' : '07:00');
    } else {
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.value = (typeof current === 'number') ? current : '';
    }
  };
  document.getElementById('goal-habit-select').addEventListener('change', syncTargetInput);
  syncTargetInput();

  document.getElementById('modal-save').onclick = () => {
    const key = document.getElementById('goal-habit-select').value;
    const raw = (document.getElementById('goal-target-input').value || '').trim();
    if (!raw) {
      toast('مقدار هدف را وارد کن', 'error');
      return;
    }
    updateGoal(key, raw);
    closeModal();
    toast('🎯 هدف ذخیره شد', 'success');
  };

  document.getElementById('modal-overlay').classList.add('active');
  trapFocus('modal');
}

function deleteCustomGoal(keyOrParams) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  if (appData.settings.goals.custom && appData.settings.goals.custom[key]) {
    delete appData.settings.goals.custom[key];
    saveAll();
    renderSettings();
    renderDashboard();
  }
}

function updateJournalPrompt(time, index, value) {
  const arr = time === 'morning' ? JOURNAL_MORNING_PROMPTS : JOURNAL_EVENING_PROMPTS;
  const defaultArr = time === 'morning' ? DEFAULT_JOURNAL_MORNING_PROMPTS : DEFAULT_JOURNAL_EVENING_PROMPTS;
  const customArr = time === 'morning' ? appData.settings.customMorningPrompts : appData.settings.customEveningPrompts;

  if (index < defaultArr.length) {
    // Editing default - can't modify, but we can override in custom
    if (!customArr[index]) customArr[index] = arr[index];
    customArr[index] = value;
  } else {
    const customIdx = index - defaultArr.length;
    customArr[customIdx] = value;
  }
  mergeCustomSettings();
  saveAll();
}

function deleteJournalPrompt(timeOrParams, indexOrUndefined) {
  let time, index;
  if (typeof timeOrParams === 'object' && timeOrParams) {
    time = timeOrParams.time; index = timeOrParams.index;
  } else {
    time = timeOrParams; index = indexOrUndefined;
  }
  const customArr = time === 'morning' ? appData.settings.customMorningPrompts : appData.settings.customEveningPrompts;
  const defaultLen = time === 'morning' ? DEFAULT_JOURNAL_MORNING_PROMPTS.length : DEFAULT_JOURNAL_EVENING_PROMPTS.length;

  if (index >= defaultLen) {
    customArr.splice(index - defaultLen, 1);
    mergeCustomSettings();
    saveAll();
    renderSettings();
  }
}

function addJournalPrompt(timeOrParams) {
  const time = typeof timeOrParams === 'object' ? timeOrParams.time : timeOrParams;
  const customArr = time === 'morning' ? appData.settings.customMorningPrompts : appData.settings.customEveningPrompts;
  customArr.push('پرامپت جدید...');
  mergeCustomSettings();
  saveAll();
  renderSettings();
}

function updateJournalTag(index, value) {
  const defaultLen = DEFAULT_JOURNAL_TAGS.length;

let reminderInterval = null;

function startReminderEngine() {
  if (reminderInterval) clearInterval(reminderInterval);
  reminderInterval = setInterval(checkReminders, 60000);
  checkReminders(); // Check immediately
}

function checkReminders() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const currentTime = hours + ':' + minutes;

  const reminders = appData.settings.reminders;
  const lastReminded = appData.reminders.lastReminded || {};
  const todayStr = localDateStr();

  for (const [key, rem] of Object.entries(reminders)) {
    if (!rem.enabled) continue;
    if (rem.time === currentTime) {
      const reminderKey = todayStr + ':' + key;
      if (lastReminded[reminderKey]) continue;

      // Fire reminder
      lastReminded[reminderKey] = now.getTime();
      appData.reminders.lastReminded = lastReminded;
      saveAll();

      const def = HABIT_DEFS[key];
      const icon = def ? def.icon : '⏰';
      const msg = rem.msg || 'یادآوری';

      toast(msg, 'reminder', icon, () => {
        switchTab('dashboard');
      });
      playBeep();
    }
  }
}

function playBeep(frequency, duration) {
  frequency = frequency || 440;
  duration = duration || 200;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = frequency;
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000);
  } catch (e) {
    // Audio not available
  }
}

// 12. TOAST NOTIFICATIONS (Phase 3 - Enhanced)
// ==========================================================
function toast(msg, type, icon, action) {
  type = type || 'info';
  const container = document.getElementById('toast-container');
  const id = 'toast-' + Date.now();

  const icons = { success: '✅', error: '❌', info: 'ℹ️', reminder: '⏰', smart: '🤖' };
  const toastIcon = icon || icons[type] || 'ℹ️';

  const toastEl = document.createElement('div');
  toastEl.className = 'toast toast-' + type;
  toastEl.id = id;
  toastEl.innerHTML = `
    <span class="toast-icon">${toastIcon}</span>
    <div class="toast-body">
      <div class="toast-msg">${msg}</div>
    </div>
    <div class="toast-actions">
      ${action ? `<button data-action="runToastAction" data-toast-id="${id}">ثبت کن</button>` : ''}
    </div>
    <button class="toast-close" data-action="dismissToast" data-params='{"id":"${id}"}'>✕</button>
  `;

  // Store action callback on a map
  if (action) {
    window._toastActions = window._toastActions || {};
    window._toastActions[id] = action;
  }
  container.appendChild(toastEl);

  // Auto-dismiss after 5 seconds
  setTimeout(() => dismissToast(id), 5000);
}

function runToastAction(params) {
  const id = params.toastId;
  const el = document.getElementById(id);
  if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 300); }
  if (window._toastActions && window._toastActions[id]) {
    const fn = window._toastActions[id];
    delete window._toastActions[id];
    fn();
  }
}

function dismissToast(idOrParams) {
  const id = typeof idOrParams === 'string' ? idOrParams : (idOrParams && idOrParams.id);
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('removing');
  setTimeout(() => el.remove(), 300);
}

// Smart toast with time-based contextual messages
function smartToast(action) {
  const hour = new Date().getHours();
  const ds = localDateStr();
  const hd = appData.habits[ds] || {};
  const messages = [];

  if (action === 'morning') {
    if (hour >= 5 && hour < 9) {
      if (!hd.wakeUp) messages.push({icon:'☀️', msg:'صبح بخیر! ساعت بیداری امروز را ثبت کنید.', type:'smart'});
      else messages.push({icon:'👍', msg:'ساعت بیداری ثبت شده. روز خوبی داشته باشید!', type:'success'});
    }
  } else if (action === 'exercise') {
    if (hour >= 16 && hour < 20 && !hd.exercise) {
      messages.push({icon:'🏃', msg:'وقت ورزش است! چند دقیقه ورزش کردید؟', type:'smart'});
    }
  } else if (action === 'sleep') {
    if (hour >= 22 || hour < 2) {
      if (!hd.sleep) messages.push({icon:'🌙', msg:'ساعت خواب فرا رسیده. خواب خوب داشته باشید!', type:'smart'});
    }
  } else if (action === 'water') {
    if (hour >= 9 && hour < 18 && hd.water && (hd.water.count || 0) < 4) {
      messages.push({icon:'💧', msg:'فقط ' + (hd.water.count||0) + ' لیوان آب نوشیدید. بیشتر بنوشید!', type:'smart'});
    }
  }

  messages.forEach(m => toast(m.msg, m.type, m.icon));
}

function downloadBackup() {
  const data = loadAllDataForBackup();
  const backup = { exportedAt: new Date().toISOString(), version: 1, data };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-assist-${localDateStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('⬇️ بکاپ دانلود شد', 'success');
}

function loadAllDataForBackup() {
  return appData;
}

function restoreBackup(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const backup = JSON.parse(e.target.result);
      if (backup.version !== 1) {
        toast('نسخه فایل نامعتبر', 'error');
        return;
      }
      if (!confirm('تمام داده‌های فعلی جایگزین می‌شوند. مطمئنید؟')) return;
      appData = backup.data;
      saveAll();
      renderAll();
      toast('✅ بازیابی با موفقیت انجام شد', 'success');
    } catch (err) {
      toast('خطا در خواندن فایل', 'error');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
}

function autoBackup() {
  if (!appData.settings.backup.autoBackup) return;
  const lastBackupKey = 'life_assist_last_backup';
  const lastBackup = localStorage.getItem(lastBackupKey);
  const today = localDateStr();
  if (lastBackup === today) return;

  downloadBackup();
  localStorage.setItem(lastBackupKey, today);
}

function exportHabitsCSV() {
  let csv = 'تاریخ,عادت,وضعیت,مقدار\n';
  const dates = Object.keys(appData.habits).sort();
  for (const ds of dates) {
    const hd = appData.habits[ds];
    for (const [key, val] of Object.entries(hd)) {
      const def = HABIT_DEFS[key];
      if (!def) continue;
      let status = isHabitDone(key, hd) ? 'انجام شده' : 'انجام نشده';
      let value = '';
      if (def.unit === 'boolean') value = val.done ? 'بله' : 'خیر';
      else if (def.unit === 'count') value = val.count || 0;
      else if (def.unit === 'minutes') value = val.minutes || 0;
      else if (def.unit === 'time') value = val.time || '';
      else if (def.unit === 'quality') value = (val.bedtime || '') + ' / ' + (val.quality || '');
      csv += `${ds},${def.name},${status},${value}\n`;
    }
  }
  downloadCSV(csv, `habits-${localDateStr()}.csv`);
}

function exportFinanceCSV() {
  let csv = 'تاریخ,نوع,مبلغ,توضیح,دسته\n';
  const dates = Object.keys(appData.finance).sort();
  for (const ds of dates) {
    const fd = appData.finance[ds];
    for (const e of fd.entries) {
      csv += `${ds},${e.type === 'income' ? 'درآمد' : 'هزینه'},${e.amount},"${e.desc}",${e.category || ''}\n`;
    }
  }
  downloadCSV(csv, `finance-${localDateStr()}.csv`);
}

function downloadCSV(csv, filename) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('📊 فایل CSV دانلود شد', 'success');
}

function init() {
  if (window.__lifeAssistInited) return;
  window.__lifeAssistInited = true;
  try {
  var _err=document.getElementById("js-error");if(_err)_err.style.display="none";
  loadAll();
  renderAll();
  startReminderEngine();
  autoBackup();

  // Show onboarding for first-time users
  if (isFirstRun()) {
    setTimeout(() => showOnboarding(), 500);
  }

  // Phase 3: Enhanced Keyboard Shortcuts
  document.addEventListener('keydown', (e) => {
    // Don't trigger if typing in an input
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    // Escape: close modal
    if (e.key === 'Escape') {
      closeModal();
      return;
    }

    // Ctrl+S: download backup
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      downloadBackup();
      return;
    }

    // Number keys 1-7: switch tabs
    const tabKeys = {'1':'dashboard','2':'habits','3':'journal','4':'finance','5':'analytics','6':'aihelp','7':'settings'};
    if (tabKeys[e.key]) {
      switchTab(tabKeys[e.key]);
      return;
    }

    // Space: toggle selected habit (on habits tab)
    if (e.key === ' ' && currentTab === 'habits') {
      e.preventDefault();
      // Try to find first unchecked habit and toggle it
      const today = localDateStr();
      const dayData = getDayHabits(today);
      for (const key of Object.keys(HABIT_DEFS)) {
        if (!isHabitDone(key, dayData)) {
          toggleHabit(key);
          break;
        }
      }
      return;
    }

    // Arrow keys: navigate days (RTL: Right = future, Left = past)
    if (e.key === 'ArrowRight') {
      selectedDate = jalali.addDays(selectedDate, 1);
      renderAll();
      return;
    }
    if (e.key === 'ArrowLeft') {
      selectedDate = jalali.addDays(selectedDate, -1);
      renderAll();
      return;
    }
  });

  // Event delegation: route data-action attributes to functions
  // This replaces all inline onclick handlers for CSP compatibility
  function routeAction(action, params) {
    const fn = window[action];
    if (typeof fn !== 'function') return;
    if (params && Object.keys(params).length > 0) {
      const keys = Object.keys(params);
      // Try named params if first key matches a known param, else spread values
      if (fn.length > 1 && keys.length > 1 && fn.toString().includes(keys[0])) {
        fn(params);
      } else {
        fn(...Object.values(params));
      }
    } else {
      fn();
    }
  }
  // Input delegation: route data-action-input on input/change events (for sliders etc.)
  function handleInputAction(e) {
    const el = e.target.closest('[data-action-input]');
    if (!el) return;
    const action = el.dataset.actionInput;
    const fn = window[action];
    if (typeof fn !== 'function') return;
    if (el.dataset.paramsInput) {
      try {
        const params = JSON.parse(el.dataset.paramsInput);
        fn(params.key, e.target.value);
      } catch { fn(e.target.value); }
    } else {
      fn(e.target.value);
    }
  }
  document.addEventListener('input', handleInputAction);
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-action-input]');
    if (el && el.tagName === 'SELECT') handleInputAction(e);
    // Also handle data-action="setJournalFilterMood" on select
    const sel = e.target.closest('[data-action]');
    if (sel && sel.tagName === 'SELECT') {
      const action = sel.dataset.action;
      const fn = window[action];
      if (typeof fn === 'function') fn({ value: e.target.value });
    }
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    e.stopPropagation(); // Prevent parent data-action from firing
    const action = el.dataset.action;
    let params = {};
    if (el.dataset.params) {
      try { params = JSON.parse(el.dataset.params); } catch { params = {}; }
    }
    routeAction(action, params);
  });
  // Click outside modal to close
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  // Phase 3: Smart Toasts - time-based contextual messages
  smartToast('morning');
  smartToast('exercise');
  smartToast('sleep');
  smartToast('water');
  } catch(e) { console.error('Life Assist init error:',e);var _e=document.getElementById('js-error');if(_e){_e.style.display='block';var _m=document.getElementById('js-error-msg');if(_m)_m.textContent=e.message;}}
}
