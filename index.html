<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life Assist — مدیریت زندگی</title>
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="مدیریت زندگی شخصی - عادت‌ها، ژورنال، مالی">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0e14'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E📖%3C/text%3E%3C/svg%3E">
<!-- فونت گوگل به‌صورت غیرمسدودکننده بارگذاری می‌شود؛ اگر شبکه در دسترس نباشد (مثلاً حالت file:// در Safari)، صفحه هرگز منتظر آن نمی‌ماند و از فونت سیستمی fallback استفاده می‌کند -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"></noscript>
<style>
/* ============================================================
   LIFE ASSIST — Glassmorphism Design System
   جایگزین CSS قدیمی — منطق JS دست‌نخورده است
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* --- Font stack: system first, Vazirmatn as enhancement --- */
  --font-primary: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Cairo, sans-serif;

  /* --- دانه‌های پایه (جامد — مهم: متغیرهای به‌کاررفته در JS) --- */
  --bg: #0a0e14;               /* برای متون روی دکمه‌های accent — باید جامد بماند */
  --border: rgba(255,255,255,0.12);
  --border-bright: rgba(255,255,255,0.30);
  --text: #eef2fb;
  --text-dim: #a7b4cd;
  --text-faint: #66738f;

  /* دانه‌های شیشه‌ای (translate برای سطح‌های دارای var) */
  --bg-elevated: rgba(255,255,255,0.05);
  --bg-hover: rgba(255,255,255,0.11);
  --bg-input: rgba(13,20,36,0.62);

  /* رنگ‌های نشانه */
  --accent: #39d0d8; --green: #3fb950; --red: #ff6b6b;
  --amber: #f0883e; --purple: #a371f7; --gold: #ffd60a;
  --physical: #7fb3a0; --mental: #8b8fd6; --growth: #e8c07d;
  --coral: #ff6b9d; --sleep-color: #6b7fff;

  /* سیستم شیشه‌ای */
  --glass: linear-gradient(150deg, rgba(255,255,255,0.105), rgba(255,255,255,0.028));
  --glass-strong: linear-gradient(150deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
  --glass-blur: 16px;
  --glow-accent: 0 0 24px rgba(57,208,216,0.38);
  --glow-green: 0 0 22px rgba(63,185,80,0.35);
  --glow-purple: 0 0 22px rgba(163,113,247,0.38);
  --ring-track: rgba(255,255,255,0.08);

  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
  --shadow: 0 12px 36px rgba(0,0,0,0.45);
  --transition: 200ms cubic-bezier(.2,.7,.3,1);
  --sidebar-w: 262px; --header-h: 60px;
}
html { font-size: 14px; }
body {
  font-family: 'Vazirmatn', var(--font-primary);
  background: #0b0e17;
  color: var(--text); min-height: 100vh;
  overflow: hidden; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(57,208,216,0.30); color: #fff; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.16); border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

/* ============ AURORA BACKGROUND ============ */
#aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#aurora .orb {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: 0.75;
  will-change: transform;
}
#aurora .o1 { width: 46vw; height: 46vw; top: -12vw; right: -8vw;
  background: radial-gradient(circle at 30% 30%, rgba(57,208,216,0.55), rgba(57,208,216,0.05));
  animation: drift1 26s ease-in-out infinite alternate; }
#aurora .o2 { width: 40vw; height: 40vw; bottom: -10vw; left: -8vw;
  background: radial-gradient(circle at 60% 40%, rgba(163,113,247,0.50), rgba(163,113,247,0.04));
  animation: drift2 32s ease-in-out infinite alternate; }
#aurora .o3 { width: 30vw; height: 30vw; top: 42%; left: 38%;
  background: radial-gradient(circle at 50% 50%, rgba(255,107,157,0.34), rgba(255,214,10,0.04));
  animation: drift3 22s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, 4vh) scale(1.15); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-5vw, -6vh) scale(1.1); } }
@keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(4vw, 6vh) scale(1.2); } }

/* ============ GLASS SURFACES ============ */
.glass { background: var(--glass);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  border: 1px solid rgba(255,255,255,0.13);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 30px rgba(0,0,0,0.40);
}
.glass-strong {
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 34px rgba(0,0,0,0.45);
  will-change: backdrop-filter;
}
.glass-hover:hover {
  background: var(--bg-hover);
  border-color: rgba(255,255,255,0.24);
}
.card, .habit-card, .mood-card, .streak-bar, .streak-calendar,
.mini-cal, .setting-section, .stat-card, .asset-card, .achievement-badge,
.journal-entry-card, .prompt-card, .ai-profile-card, .weekly-stat-card,
.avg7-card, .health-rings-card, .toast {
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  border: 1px solid rgba(255,255,255,0.13);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 30px rgba(0,0,0,0.40);
}
#sidebar, #header, #modal {
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 34px rgba(0,0,0,0.45);
  will-change: backdrop-filter;
}

/* ========== SIDEBAR ========== */
#sidebar {
  position: fixed; top: 0; right: 0; width: var(--sidebar-w);
  height: 100vh; z-index: 100;
  display: flex; flex-direction: column; overflow: hidden;
  border-left: 1px solid rgba(255,255,255,0.12);
  transition: transform var(--transition);
}
.sidebar-brand {
  padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.10);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-brand .logo {
  font-size: 26px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: rgba(57,208,216,0.14); border: 1px solid rgba(57,208,216,0.3);
  border-radius: 13px; box-shadow: 0 0 18px rgba(57,208,216,0.18);
}
.sidebar-brand h1 {
  font-size: 17px; font-weight: 800; color: var(--accent);
  text-shadow: 0 0 18px rgba(57,208,216,0.4);
}
.sidebar-brand small { font-size: 11px; color: var(--text-faint); display: block; }
#sidebar nav { flex: 1; padding: 10px; overflow-y: auto; }
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 14px;
  cursor: pointer; color: var(--text-dim); font-size: 14px;
  font-weight: 500; margin-bottom: 4px;
  -webkit-user-select: none; user-select: none;
  transition: all var(--transition);
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: var(--text); transform: translateX(-3px); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(57,208,216,0.20), rgba(163,113,247,0.14));
  border: 1px solid rgba(57,208,216,0.35);
  color: var(--accent); font-weight: 700;
  box-shadow: 0 0 20px rgba(57,208,216,0.12), inset 0 1px 0 rgba(255,255,255,0.18);
}
.nav-item.active::before {
  content: ''; position: absolute; right: -10px; top: 22%;
  height: 56%; width: 4px; border-radius: 3px;
  background: linear-gradient(var(--accent), var(--purple));
  box-shadow: 0 0 12px var(--accent);
}
.nav-item .icon { font-size: 18px; width: 26px; text-align: center; }
.sidebar-footer {
  padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.10);
  font-size: 11px; color: var(--text-faint);
}
.sidebar-footer button, .sidebar-footer label {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 9px; margin-top: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  color: var(--text-dim); border-radius: 12px;
  cursor: pointer; font-family: inherit; font-size: 12.5px;
  transition: all var(--transition);
}
.sidebar-footer button:hover, .sidebar-footer label:hover { background: rgba(255,255,255,0.12); color: var(--text); border-color: rgba(57,208,216,0.5); box-shadow: 0 0 14px rgba(57,208,216,0.15); }
.sidebar-footer .danger { color: var(--red); }
.sidebar-footer .danger:hover { border-color: var(--red); box-shadow: 0 0 14px rgba(255,107,107,0.25); }
#sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(4,6,12,0.62);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  z-index: 99;
}

/* ========== HEADER ========== */
#header {
  position: fixed; top: 0; right: var(--sidebar-w); left: 0;
  height: var(--header-h); z-index: 90;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; transition: right var(--transition);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right .date-info { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.header-right .page-title { font-size: 19px; font-weight: 800;
  background: linear-gradient(120deg, var(--accent), var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.header-left { display: flex; align-items: center; gap: 14px; }
.header-left .slider-group {
  display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-dim);
  padding: 6px 12px; border-radius: 12px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 4px;
  background: linear-gradient(90deg, rgba(57,208,216,0.5), rgba(163,113,247,0.4));
  outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 17px; height: 17px; border-radius: 50%;
  background: linear-gradient(135deg, #5ce3ea, #39d0d8);
  border: 2px solid #fff; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(57,208,216,0.25), 0 4px 12px rgba(0,0,0,0.4);
  transition: transform var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.18); }
input[type="range"]::-moz-range-thumb {
  width: 17px; height: 17px; border-radius: 50%;
  background: linear-gradient(135deg, #5ec7ea, #39d0d8);
  border: 2px solid #fff; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(57,208,216,0.25);
}
.header-left .val {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--accent); min-width: 20px; text-align: center; font-weight: 700;
}
#hamburger {
  display: none; background: none; border: none; color: var(--text);
  font-size: 24px; cursor: pointer; padding: 4px;
}

/* ========== MAIN CONTENT ========== */
#main {
  position: fixed; top: var(--header-h); right: var(--sidebar-w);
  left: 0; bottom: 0; z-index: 5;
  overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 26px;
  transition: right var(--transition);
}
.tab-panel { display: none; animation: fadeUp 0.34s cubic-bezier(.2,.7,.3,1); }
.tab-panel.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== CARDS & WIDGETS ========== */
.card {
  border-radius: var(--radius-lg); padding: 20px;
  transition: all var(--transition);
}
.card:hover { border-color: rgba(255,255,255,0.24); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 14px 40px rgba(0,0,0,0.5); transform: translateY(-1px); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 800; }
.card-subtitle { font-size: 12px; color: var(--text-dim); }
.section-title {
  font-size: 13px; font-weight: 700; color: var(--text-dim);
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.8px;
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border-radius: 22px; font-size: 11px; font-weight: 700;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.badge-accent { background: rgba(57,208,216,0.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(57,208,216,0.25); }
.badge-green { background: rgba(63,185,80,0.16); color: var(--green); box-shadow: inset 0 0 0 1px rgba(63,185,80,0.25); }
.badge-red { background: rgba(255,107,107,0.16); color: var(--red); box-shadow: inset 0 0 0 1px rgba(255,107,107,0.25); }
.badge-amber { background: rgba(240,136,62,0.16); color: var(--amber); box-shadow: inset 0 0 0 1px rgba(240,136,62,0.25); }
.badge-purple { background: rgba(163,113,247,0.16); color: var(--purple); box-shadow: inset 0 0 0 1px rgba(163,113,247,0.25); }
.badge-soon { background: rgba(255,214,10,0.14); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255,214,10,0.25); }

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 18px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: var(--text); font-family: inherit; font-size: 13px;
  font-weight: 600; cursor: pointer;
  transition: all var(--transition);
  -webkit-user-select: none; user-select: none;
}
.btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  border: none;
  background: linear-gradient(135deg, #39d0d8, #2bb3d1);
  color: #04121b; font-weight: 800;
  box-shadow: 0 4px 18px rgba(57,208,216,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn-primary:hover { box-shadow: 0 6px 26px rgba(57,208,216,0.5); background: linear-gradient(135deg, #4adae2, #39c3d9); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 10px; }
.btn-danger { color: var(--red); border-color: rgba(255,107,107,0.35); }
.btn-danger:hover { background: rgba(255,107,107,0.12); border-color: var(--red); box-shadow: 0 0 16px rgba(255,107,107,0.25); }
.btn-green { border: none; background: linear-gradient(135deg, #3fb950, #2e9e44); color: #04120a; box-shadow: 0 4px 16px rgba(63,185,80,0.3); }
.btn-green:hover { box-shadow: 0 6px 24px rgba(63,185,80,0.45); }

/* ========== INPUTS ========== */
input[type="text"], input[type="time"], input[type="number"], textarea, select {
  background: var(--bg-input);
  border: 1px solid rgba(255,255,255,0.14);
  color: var(--text); border-radius: 12px;
  padding: 9px 13px; font-family: inherit; font-size: 13px;
  width: 100%; outline: none;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: border var(--transition), box-shadow var(--transition), background var(--transition);
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(57,208,216,0.18), 0 0 18px rgba(57,208,216,0.15);
}
textarea { resize: vertical; min-height: 80px; }
label { font-size: 13px; color: var(--text-dim); margin-bottom: 5px; display: block; }
.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }

/* ========== HABIT CARDS GRID ========== */
.habits-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 18px; margin-bottom: 26px;
}
.habit-card {
  border-radius: var(--radius-lg); padding: 18px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: all var(--transition);
}
.habit-card::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120px 60px at var(--mx, 20%) var(--my, 10%), rgba(255,255,255,0.08), transparent 70%);
  opacity: 0; transition: opacity var(--transition);
}
.habit-card:hover::after { opacity: 1; }
.habit-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.26); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 16px 44px rgba(0,0,0,0.5); }
.habit-card.completed { border-color: rgba(63,185,80,0.6); box-shadow: inset 0 0 0 1px rgba(63,185,80,0.25), 0 0 20px rgba(63,185,80,0.12); }
.habit-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.habit-card-name { display: flex; align-items: center; gap: 9px; }
.habit-card-name .icon { font-size: 22px; }
.habit-card-name .label { font-size: 14px; font-weight: 700; }
.habit-card-streak {
  background: rgba(255,214,10,0.14); color: var(--gold);
  padding: 3px 10px; border-radius: 14px; font-size: 11px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(255,214,10,0.25);
}
.habit-card-ring { display: flex; justify-content: center; margin-bottom: 14px; }
.habit-card-ring svg { filter: drop-shadow(0 0 10px rgba(57,189,216,0.30)); }
.habit-card-actions { display: flex; align-items: center; justify-content: center; gap: 8px; }
.habit-card-actions .counter {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-input); padding: 5px 14px; border-radius: 12px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.10);
}
.habit-card-actions .counter button {
  background: none; border: none; color: var(--accent);
  font-size: 19px; cursor: pointer; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: all var(--transition);
}
.habit-card-actions .counter button:hover { background: rgba(57,208,216,0.16); box-shadow: 0 0 12px rgba(57,208,216,0.25); }
.habit-card-actions .counter .val {
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  font-weight: 700; min-width: 32px; text-align: center;
}
.habit-card-actions select {
  background: var(--bg-input); border: 1px solid rgba(255,255,255,0.14);
  color: var(--text); border-radius: 10px;
  padding: 5px 10px; font-size: 12px; font-family: inherit; width: auto;
}
.habit-card-actions input[type="time"] {
  width: 110px; text-align: center;
}

/* ========== SCORE RING ========== */
.score-ring-container { text-align: center; margin: 20px 0; }
.score-ring-label { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

/* ========== STREAK BAR ========== */
.streak-bar {
  display: flex; gap: 14px; padding: 18px;
  border-radius: var(--radius-lg); margin-bottom: 26px; overflow-x: auto;
}
.streak-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; min-width: 64px; flex-shrink: 0;
  padding: 8px 10px; border-radius: 12px;
  transition: all var(--transition);
}
.streak-item:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px); }
.streak-item .streak-icon { font-size: 20px; }
.streak-item .streak-num {

}

/**
 * Jalali calendar utilities for date conversion and formatting.
 */
const jalali = {
  monthNames: ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
  dayNames: ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
  _div(a, b) { return Math.floor(a / b); },
  _mod(a, b) { return a - b * Math.floor(a / b); },
  _gregorianDaysInMonth(gy, gm) {
    const m = [0,31,28,31,30,31,30,31,31,30,31,30,31];
    if (gm === 2 && ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0))) return 29;
    return m[gm];
  },
  g_to_j(gy, gm, gd) {
    const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    let gy2 = (gm > 2) ? gy + 1 : gy;
    let days = 355666 + (365 * gy) + this._div(gy2 + 3, 4) - this._div(gy2 + 99, 100)
             + this._div(gy2 + 399, 400) + gd + g_d_m[gm - 1];
    let jy = -1595 + (33 * this._div(days, 12053));
    days = this._mod(days, 12053);
    jy += 4 * this._div(days, 1461);
    days = this._mod(days, 1461);
    if (days > 365) {
      jy += this._div(days - 1, 365);
      days = this._mod(days - 1, 365);
    }
    let jm, jd;
    if (days < 186) { jm = 1 + this._div(days, 31); jd = 1 + this._mod(days, 31); }
    else { days -= 186; jm = 7 + this._div(days, 30); jd = 1 + this._mod(days, 30); }
    return { jy, jm, jd };
  },
  j_to_g(jy, jm, jd) {
    jy += 1595;
    let days = -355668 + (365 * jy) + this._div(jy, 33) * 8 + this._div(jy + 4, 1461)
             + this._mod(jm - 1, 6) * 31 + this._mod(jm, 6) * (jd - 1);
    let gy = 4 * this._div(days, 1461);
    days -= this._div(gy, 4) * 1461;
    if (days > 365) { gy += this._div(days - 1, 365); days = this._mod(days - 1, 365); }
    if (days < 166) { days += 1; }
    else { days += 1; }
    let gd = days;
    let gm = 1;
    const dim = [0,31,29,31,30,31,30,31,31,30,31,30,31];
    for (let i = 1; i <= 12; i++) {
      if (gd <= dim[i]) { gm = i; break; }
      gd -= dim[i];
    }
    return { gy, gm, gd };
  },
  days_in_month(jy, jm) {
    if (jm <= 6) return 31;
    if (jm <= 11) return 30;
    // 12th month: leap check
    return (this._mod(((jy + 19) * 35) / 33, 1) < 1) ? 30 : 29;
  },
  format(date, fmt) {
    fmt = fmt || 'YYYY/MM/DD';
    const j = this.g_to_j(date.getFullYear(), date.getMonth() + 1, date.getDate());
    const pad = n => String(n).padStart(2, '0');
    return fmt.replace('YYYY', j.jy).replace('MM', pad(j.jm)).replace('DD', pad(j.jd));
  },
  formatFull(date) {
    const j = this.g_to_j(date.getFullYear(), date.getMonth() + 1, date.getDate());
    const dow = date.getDay(); // 0=Sun
    const dayIndex = (dow + 1) % 7; // Sat=0, Sun=1, ...
    return `${this.dayNames[dayIndex]} ${j.jd} ${this.monthNames[j.jm - 1]} ${j.jy}`;
  },
  today() { return this.format(new Date()); },
  parseJalali(str) {
    // Parse "YYYY/MM/DD"
    const p = str.split('/');
    return { jy: +p[0], jm: +p[1], jd: +p[2] };
  },
  jToJsDate(jy, jm, jd) {
    const g = this.j_to_g(jy, jm, jd);
    return new Date(g.gy, g.gm - 1, g.gd);
  },
  addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  },
  getMonthDays(jy, jm) {
    return this.days_in_month(jy, jm);
  },
    /**
   * Returns the first day of month index (0=Saturday ... 6=Friday).
   * @param {number} jy - Jalali year.
   * @param {number} jm - Jalali month.
   * @returns {number} Day index 0-6.
   */
  firstDayOfMonth(jy, jm) {
    const g = this.j_to_g(jy, jm, 1);
    const d = new Date(g.gy, g.gm - 1, g.gd);
    return (d.getDay() + 1) % 7; // Sat=0
  },
  /**
   * Returns the Jalali day-of-week for a JS Date (0=Saturday ... 6=Friday).
   * @param {Date} date - JavaScript Date object.
   * @returns {number} Day index 0-6 (Saturday=0).
   */
  dayOfWeek(date) {
    // Returns 0=Saturday ... 6=Friday for a JS Date (Jalali week)
    const dow = date.getDay(); // 0=Sun in JS
    return (dow + 1) % 7; // Sat=0, Sun=1, ..., Fri=6
  }
};

function validateAndMigrate(data) {
  // Version check and migration
  if (!data.version) data = migrateV1toV2(data);
  if (data.version === 2) data = migrateV2toV3(data);
  if (data.version === 3) data = migrateV3toV4(data);
  if (data.version === 4) data = migrateV4toV5(data);

  // Schema validation and sanitization
  // Ensure required top-level keys
  const required = ['version', 'habits', 'settings', 'mood', 'journal', 'finance', 'assets', 'reminders'];
  for (const key of required) {
    if (data[key] === undefined) {
      const def = defaultData();
      data[key] = def[key];
    }
  }

  // Sanitize habits entries: ensure numeric values, trim strings
  for (const dateStr of Object.keys(data.habits)) {
    const hd = data.habits[dateStr];
    if (hd && typeof hd === 'object') {
      for (const [habitKey, val] of Object.entries(hd)) {
        if (!val || typeof val !== 'object') continue;
        // Clamp numeric values
        if (val.count !== undefined) val.count = Math.max(0, Math.min(999, val.count));
        if (val.minutes !== undefined) val.minutes = Math.max(0, Math.min(9999, val.minutes));
        if (val.score !== undefined) val.score = Math.max(0, Math.min(100, val.score));
        // Trim string values
        if (val.time) val.time = String(val.time).trim();
        if (val.bedtime) val.bedtime = String(val.bedtime).trim();
        if (val.notes) val.notes = String(val.notes).trim();
        if (val.lastReason) val.lastReason = String(val.lastReason).trim();
        if (val.quality !== undefined) val.quality = Math.max(1, Math.min(5, val.quality));
      }
    } else if (hd !== null) {
      delete data.habits[dateStr];
    }
  }

  // Sanitize finance entries
  for (const dateStr of Object.keys(data.finance)) {
    const fd = data.finance[dateStr];
    if (fd && fd.entries) {
      for (const e of fd.entries) {
        if (e.amount !== undefined) e.amount = Math.max(0, Math.min(999999999, e.amount));
        if (e.desc) e.desc = String(e.desc).trim().substring(0, 500);
        if (e.category) e.category = String(e.category).trim();
        if (e.type && (e.type !== 'income' && e.type !== 'expense')) e.type = 'expense';
      }
    }
  }

  // Sanitize mood entries
  for (const dateStr of Object.keys(data.mood)) {
    const m = data.mood[dateStr];
    if (m && typeof m === 'object') {
      m.mood = Math.max(1, Math.min(10, m.mood || 5));
      m.energy = Math.max(1, Math.min(10, m.energy || 5));
      m.stress = Math.max(1, Math.min(10, m.stress || 5));
    }
  }

  // Sanitize journal entries
  for (const dateStr of Object.keys(data.journal)) {
    const jd = data.journal[dateStr];
    if (jd && typeof jd === 'object') {
      jd.mood = Math.max(1, Math.min(10, jd.mood || 5));
      jd.tags = Array.isArray(jd.tags) ? jd.tags : [];
      jd.morningAnswers = Array.isArray(jd.morningAnswers) ? jd.morningAnswers : [];
      jd.eveningAnswers = Array.isArray(jd.eveningAnswers) ? jd.eveningAnswers : [];
    }
  }

  // Sanitize assets
  for (const [key, val] of Object.entries(data.assets || {})) {
    data.assets[key] = Math.max(0, Math.min(999999999, val || 0));
  }

  // Validate category weights sum to 100 (normalize if needed)
  if (data.settings.customCategories) {
    const cats = { ...DEFAULT_HEALTH_CATEGORIES, ...data.settings.customCategories };
    const totalWeight = Object.values(cats).reduce((sum, c) => sum + (c.weight || 0), 0);
    if (totalWeight > 0 && totalWeight !== 100) {
      for (const key of Object.keys(cats)) {
        if (cats[key].weight) cats[key].weight = Math.round((cats[key].weight / totalWeight) * 100);
      }
    }
    // Ensure at least one category exists
    if (Object.keys(cats).length === 0) {
      data.settings.customCategories = {};
    }
  }

  data.version = APP_VERSION;
  return data;
}

function migrateV1toV2(data) {
  // Old format: habits had different structure
  if (!data.habits) data.habits = {};
  data.version = 2;
  return data;
}

function migrateV2toV3(data) {
  // V2 to V3: ensure settings structure
  if (!data.settings) data.settings = defaultData().settings;
  if (data.settings.goals && !data.settings.goals.monthlyBudget) data.settings.goals.monthlyBudget = 0;
  data.version = 3;
  return data;
}

function migrateV3toV4(data) {
  // V3 to V4: ensure assets structure has all asset types
  const defAssets = defaultData().assets;
  if (!data.assets) data.assets = { ...defAssets };
  for (const key of Object.keys(defAssets)) {
    if (data.assets[key] === undefined) data.assets[key] = 0;
  }
  data.version = APP_VERSION;
  return data;
}

function migrateV4toV5(data) {
  // V4 to V5: migrate to new editable schema
  // Initialize custom settings if missing
  if (!data.settings.customCategories) data.settings.customCategories = {};
  if (!data.settings.customHabits) data.settings.customHabits = {};
  if (!data.settings.customExerciseTypes) data.settings.customExerciseTypes = {};
  if (!data.settings.customLearningTypes) data.settings.customLearningTypes = {};
  if (!data.settings.customMorningPrompts) data.settings.customMorningPrompts = [];
  if (!data.settings.customEveningPrompts) data.settings.customEveningPrompts = [];
  if (!data.settings.customTags) data.settings.customTags = [];
  if (!data.settings.customAssets) data.settings.customAssets = [];
  if (!data.settings.customFinanceCategories) data.settings.customFinanceCategories = { income: [], expense: [] };

  // Ensure goals.custom exists
  if (!data.settings.goals.custom) data.settings.goals.custom = {};

  // Migrate old smoking fields if present
  if (data.settings.goals.smokingStart !== undefined) delete data.settings.goals.smokingStart;
  if (data.settings.goals.smokingWeeks !== undefined) delete data.settings.goals.smokingWeeks;

  // Ensure all habit entries reference valid categories
  for (const dateStr of Object.keys(data.habits)) {
    const hd = data.habits[dateStr];
    if (hd && typeof hd === 'object') {
      for (const habitKey of Object.keys(hd)) {
        if (!HABIT_DEFS[habitKey] && !data.settings.customHabits[habitKey]) {
          // Habit def missing — could be a deleted custom habit, keep data but mark
          console.warn(`Habit ${habitKey} in ${dateStr} has no definition`);
        }
      }
    }
  }

  data.version = APP_VERSION;
  return data;
}

/**
 * Loads all app data from localStorage with validation and migration.
 * Falls back to default data if loading fails.
 * Merges user customizations into runtime constants.
 * @returns {void}
 */
function loadAll() {
  if (!isStorageAvailable()) {
    console.error('localStorage در دسترس نیست — احتمالاً حالت خصوصی مرورگر فعال است.');
    appData = defaultData();
    mergeCustomSettings();
    return;
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      appData = JSON.parse(raw);
      appData = validateAndMigrate(appData);
    } else {
      appData = defaultData();
    }
    mergeCustomSettings();
  } catch (e) {
    console.error('Load error:', e);
    appData = defaultData();
    mergeCustomSettings();
  }
}

/**
 * Merges user custom settings from appData.settings into runtime constants.
 * Called after loadAll() and after any settings change.
 */
function mergeCustomSettings() {
  if (!appData?.settings) return;
  const s = appData.settings;

  // Merge categories
  if (s.customCategories) {
    HEALTH_CATEGORIES = { ...DEFAULT_HEALTH_CATEGORIES, ...s.customCategories };
  } else {
    HEALTH_CATEGORIES = { ...DEFAULT_HEALTH_CATEGORIES };
  }

  // Merge habits
  if (s.customHabits) {
    HABIT_DEFS = { ...DEFAULT_HABIT_DEFS, ...s.customHabits };
  } else {
    HABIT_DEFS = { ...DEFAULT_HABIT_DEFS };
  }

  // Merge exercise types
  if (s.customExerciseTypes) {
    EXERCISE_TYPES = { ...DEFAULT_EXERCISE_TYPES, ...s.customExerciseTypes };
  } else {
    EXERCISE_TYPES = { ...DEFAULT_EXERCISE_TYPES };
  }

  // Merge learning types
  if (s.customLearningTypes) {
    LEARNING_TYPES = { ...DEFAULT_LEARNING_TYPES, ...s.customLearningTypes };
  } else {
    LEARNING_TYPES = { ...DEFAULT_LEARNING_TYPES };
  }

  // Merge journal prompts
  if (s.customMorningPrompts) {
    JOURNAL_MORNING_PROMPTS = [...DEFAULT_JOURNAL_MORNING_PROMPTS, ...s.customMorningPrompts];
  } else {

// Update CSS variables for category colors (called after mergeCustomSettings)
function updateCategoryCSSVariables() {
  for (const [key, cat] of Object.entries(HEALTH_CATEGORIES)) {
    document.documentElement.style.setProperty(`--cat-${key}`, cat.color);
  }
  // Also update cat-badge colors.
  // نکته: document.styleSheets[0] همیشه استایل خودِ برنامه نیست — اگر شیت گوگل‌فونت
  // (که از دامنه دیگری بارگذاری می‌شود) زودتر در لیست باشد، خواندن cssRules آن
  // یک SecurityError پرتاب می‌کند. به‌جای آن، شیت داخلی (بدون href) را پیدا می‌کنیم.
  let styleSheet = null;
  for (const sheet of document.styleSheets) {
    if (!sheet.href) { styleSheet = sheet; break; }
  }
  if (styleSheet) {
    try {
      // Remove old dynamic cat-badge rules
      for (let i = styleSheet.cssRules.length - 1; i >= 0; i--) {
        const rule = styleSheet.cssRules[i];
        if (rule.selectorText && rule.selectorText.includes('.cat-badge.')) {
          styleSheet.deleteRule(i);
        }
      }
      // Add new cat-badge rules
      for (const [key, cat] of Object.entries(HEALTH_CATEGORIES)) {
        const css = `.cat-badge.${key} { background: ${cat.color}26; color: ${cat.color}; box-shadow: inset 0 0 0 1px ${cat.color}47; }`;
        try { styleSheet.insertRule(css, styleSheet.cssRules.length); } catch(e) {}
      }
    } catch (e) {
      // شیت در دسترس نیست (مثلاً cross-origin) — رنگ نشان‌ها همچنان از طریق
      // متغیرهای CSS بالا اعمال می‌شود، فقط رنگ badge داخل کلاس آپدیت نمی‌شود
    }
  }
}

/**
 * Saves all app data to localStorage with quota handling.
 * Increments the data version to invalidate the analytics cache.
 * @returns {void}
 */
function saveAll() {
  if (!isStorageAvailable()) return;
  incrementDataVersion();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      console.warn('QuotaExceededError — attempting compression/cleanup');
      if (!compressAndRetry()) {
        toast('ظرفیت ذخیره‌سازی پر شده — لطفاً بکاپ بگیرید و داده‌های قدیمی را پاک کنید', 'error');
      }
    }
    console.error('Save error:', e);
  }
}

// Compress old data by removing empty journal entries and old smoking reasons
function incrementDataVersion() {
  currentDataVersion++;
  invalidateAnalyticsCache();
}

function compressAndRetry() {
  try {
    // Clean up empty habit entries
    for (const dateStr of Object.keys(appData.habits)) {
      const hd = appData.habits[dateStr];
      if (hd) {
        for (const key of Object.keys(hd)) {
          const val = hd[key];
          if (val && typeof val === 'object') {
            // Remove empty notes
            if (val.notes === '') delete val.notes;
            // Remove zero counts for water/smoking
            if ((key === 'water' || key === 'smoking') && val.count === 0) delete val.count;
          }
        }
        // Remove entries with no meaningful data
        const hasData = Object.entries(hd).some(([k, v]) => {
          if (!v || typeof v !== 'object') return true;
          return v.done !== undefined || v.count !== undefined || v.minutes !== undefined || v.time || v.bedtime;
        });
        if (!hasData) delete appData.habits[dateStr];
      }
    }
    // Clean up empty journal entries
    for (const dateStr of Object.keys(appData.journal)) {
      const jd = appData.journal[dateStr];
      if (jd && !jd.morning && !jd.evening && (jd.morningAnswers || []).every(a => !a) && (jd.eveningAnswers || []).every(a => !a)) {
        // Keep journal entries — they may have just mood/tags
        const hasContent = jd.mood !== undefined || (jd.tags && jd.tags.length > 0);
        if (!hasContent) delete appData.journal[dateStr];
      }
    }
    // Remove old backup keys
    const keys = Object.keys(localStorage);
    for (const k of keys) {
      if (k.startsWith('life_assist_backup_')) {
        localStorage.removeItem(k);
      }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    toast('داده‌ها فشرده شد تا فضای ذخیره‌سازی آزاد شود', 'info');
    return true;
  } catch (e) {
    return false;
  }
}

// بینش هفتگی — اتصال ژورنال/حالت روحی به الگوهای رفتاری
// بر پایه ۳۰ روز اخیر، رابطه بین استرس/انرژی و عادت‌های کلیدی را پیدا می‌کند
function computeWeeklyInsights() {
  const insights = [];
  const today = new Date();
  const days = [];
  for (let i = 0; i < 30; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds];
    const mood = appData.mood[ds];
    if (hd && mood) days.push({ ds, hd, mood });
  }
  if (days.length < 6) return insights; // داده کافی برای الگوی معنادار نیست

  // ۱) رابطه استرس بالا و مصرف سیگار
  const highStressDays = days.filter(d => d.mood.stress >= 7);
  const lowStressDays = days.filter(d => d.mood.stress <= 4);
  if (highStressDays.length >= 3 && lowStressDays.length >= 3) {
    const avgSmokeHigh = highStressDays.reduce((s, d) => s + ((d.hd.smoking && d.hd.smoking.count) || 0), 0) / highStressDays.length;
    const avgSmokeLow = lowStressDays.reduce((s, d) => s + ((d.hd.smoking && d.hd.smoking.count) || 0), 0) / lowStressDays.length;
    if (avgSmokeHigh - avgSmokeLow >= 2) {
      insights.push(`در روزهای پراسترس، سیگار به‌طور میانگین ${Math.round(avgSmokeHigh - avgSmokeLow)} نخ بیشتر از روزهای آرام بوده. مدیریت استرس می‌تواند مستقیم روی سیگار اثر بگذارد.`);
    }
  }

  // ۲) رابطه خواب کم و انرژی پایین روز بعد
  const sleepDays = days.filter(d => d.hd.sleep && d.hd.sleep.bedtime);
  if (sleepDays.length >= 5) {
    const lateNights = sleepDays.filter(d => d.hd.sleep.bedtime > '23:30');
    const earlyNights = sleepDays.filter(d => d.hd.sleep.bedtime <= '23:30');
    if (lateNights.length >= 2 && earlyNights.length >= 2) {
      const avgEnergyLate = lateNights.reduce((s, d) => s + d.mood.energy, 0) / lateNights.length;
      const avgEnergyEarly = earlyNights.reduce((s, d) => s + d.mood.energy, 0) / earlyNights.length;
      if (avgEnergyEarly - avgEnergyLate >= 1.5) {
        insights.push(`در روزهایی که دیرتر از ۲۳:۳۰ خوابیده‌ای، سطح انرژی به‌طور محسوسی پایین‌تر بوده.`);
      }
    }
  }

  // ۳) رابطه ورزش و حالت روحی
  const exerciseDays = days.filter(d => d.hd.exercise && d.hd.exercise.minutes > 0);
  const noExerciseDays = days.filter(d => !d.hd.exercise || !d.hd.exercise.minutes);
  if (exerciseDays.length >= 3 && noExerciseDays.length >= 3) {
    const avgMoodEx = exerciseDays.reduce((s, d) => s + d.mood.mood, 0) / exerciseDays.length;
    const avgMoodNoEx = noExerciseDays.reduce((s, d) => s + d.mood.mood, 0) / noExerciseDays.length;
    if (avgMoodEx - avgMoodNoEx >= 1) {
      insights.push(`در روزهایی که ورزش کرده‌ای، حالت روحی به‌طور میانگین بهتر بوده — این رابطه در داده‌های خودت هم دیده می‌شود.`);
    }
  }

  return insights;
}

let currentTab = 'dashboard';

function getAnalyticsData() {
  if (analyticsCache.data && analyticsCache.version === currentDataVersion) {
    return analyticsCache.data;
  }
  const today = new Date();
  const trackedDates = Object.keys(appData.habits).filter(d => Object.keys(appData.habits[d]).length > 0);
  const totalDays = trackedDates.length;
  let allScores = trackedDates.map(d => calcDayScore(appData.habits[d]));
  const avgScore = allScores.length ? Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length) : 0;

  // Best streak
  let bestOverallStreak = 0, cur = 0;
  for (let i = 0; i < 365; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (Object.keys(hd).length > 0) { cur++; if (cur > bestOverallStreak) bestOverallStreak = cur; }
    else cur = 0;
  }

  // Heatmap data
  const heatmapData = [];
  for (let i = 364; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    const score = Object.keys(hd).length > 0 ? calcDayScore(hd) : 0;
    const level = score === 0 ? 0 : score <= 25 ? 1 : score <= 50 ? 2 : score <= 75 ? 3 : 4;
    heatmapData.push({ ds, score, level, dow: jalali.dayOfWeek(d) });
  }

  // Correlation matrix
  const habitKeys = Object.keys(HABIT_DEFS);
  const corrDates = [];
  for (let i = 29; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    corrDates.push(jalali.format(d));
  }
  const habitValues = {};
  habitKeys.forEach(k => {
    habitValues[k] = corrDates.map(ds => {
      const hd = appData.habits[ds] || {};
      const val = hd[k];
      if (!val) return 0;
      if (HABIT_DEFS[k].unit === 'boolean') return val.done ? 1 : 0;
      if (HABIT_DEFS[k].unit === 'count') return val.count || 0;
      if (HABIT_DEFS[k].unit === 'minutes') return val.minutes || 0;
      if (HABIT_DEFS[k].unit === 'time') return val.time ? (24 - parseInt(val.time)) : 0;
      if (HABIT_DEFS[k].unit === 'quality') return val.quality || 5;
      return 0;
    });
  });
  function pearson(x, y) {
    const n = x.length;
    if (n === 0) return 0;
    const mx = x.reduce((a,b)=>a+b,0)/n, my = y.reduce((a,b)=>a+b,0)/n;
    let num = 0, dx = 0, dy = 0;
    for (let i = 0; i < n; i++) {
      const a = x[i]-mx, b = y[i]-my;
      num += a*b; dx += a*a; dy += b*b;
    }
    const denom = Math.sqrt(dx*dy);
    return denom === 0 ? 0 : num/denom;
  }
  const corrMatrix = {};
  habitKeys.forEach(k1 => {
    corrMatrix[k1] = {};
    habitKeys.forEach(k2 => {
      corrMatrix[k1][k2] = pearson(habitValues[k1], habitValues[k2]);
    });
  });

  // Trend chart data
  const trendDays = 30;
  let scorePts = [], exPts = [], smokePts = [];
  const trendW = 500, trendH = 150, trendPad = 30;
  for (let i = trendDays - 1; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    const sc = calcDayScore(hd);
    const ex = hd.exercise ? Math.min(100, ((hd.exercise.minutes || 0) / 60) * 100) : 0;
    const sm = hd.smoking ? Math.max(0, 100 - ((hd.smoking.count || 0) / 20) * 100) : 100;
    const x = trendPad + ((trendDays - 1 - i) / (trendDays - 1)) * (trendW - trendPad * 2);
    scorePts.push(`${x},${trendH - trendPad - (sc / 100) * (trendH - trendPad * 2)}`);
    exPts.push(`${x},${trendH - trendPad - (ex / 100) * (trendH - trendPad * 2)}`);
    smokePts.push(`${x},${trendH - trendPad - (sm / 100) * (trendH - trendPad * 2)}`);
  }

  // Habit completion rates
  const habitRates = {};
  for (const key of Object.keys(HABIT_DEFS)) {
    let done = 0, total = 0;
    for (let i = 29; i >= 0; i--) {
      total++;
      if (isHabitDone(key, appData.habits[jalali.format(jalali.addDays(today,-i))] || {})) done++;
    }
    habitRates[key] = total > 0 ? Math.round((done/total)*100) : 0;
  }

  // Weekly stats
  let weekScores = [], weekMoods = [], weekExercises = [], weekSmoking = [];
  let weekWater = [], weekSleep = [];
  for (let i = 6; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    weekScores.push(calcDayScore(hd));
    weekMoods.push((appData.mood[ds] || {mood:5}).mood);
    weekExercises.push(hd.exercise ? (hd.exercise.minutes || 0) : 0);
    weekSmoking.push(hd.smoking ? (hd.smoking.count || 0) : 0);
    weekWater.push(hd.water ? (hd.water.count || 0) : 0);
    weekSleep.push(hd.sleep ? (hd.sleep.bedtime || '-') : '-');
  }

  // Smoking data
  let smokingData = [];
  for (let i = 29; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    smokingData.push(hd.smoking ? (hd.smoking.count || 0) : 0);
  }

  // Achievements
  const achievements = checkAchievements();

  const data = {
    totalDays, avgScore, bestOverallStreak,
    heatmapData, corrMatrix, corrDates,
    trendData: { scorePts, exPts, smokePts, trendW, trendH, trendPad },
    habitRates, weekScores, weekMoods, weekExercises, weekSmoking, weekWater, weekSleep,
    smokingData, achievements
  };
  analyticsCache.data = data;
  analyticsCache.version = currentDataVersion;
  return data;
}

/**
 * Calculates the current streak for a habit (consecutive days completed).
 * @param {string} habitKey - The habit key (e.g., 'wakeUp', 'exercise').
 * @returns {number} The streak count in days.
 */
function calcStreak(habitKey) {
  let streak = 0;
  const d = new Date();
  // Start from today, go backward
  while (true) {
    const ds = jalali.format(d);
    const hd = getDayHabits(ds);
    if (isHabitDone(habitKey, hd)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (ds === localDateStr()) {
      // Today not done yet, still count from yesterday
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function calcBestStreak(habitKey) {
  let best = 0, cur = 0;
  // Go back 365 days
  const d = new Date();
  d.setDate(d.getDate() - 365);
  for (let i = 0; i < 366; i++) {
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (isHabitDone(habitKey, hd)) {
      cur++;
      if (cur > best) best = cur;
    } else {
      cur = 0;
    }
    d.setDate(d.getDate() + 1);
  }
  return best;
}

/**
 * Checks if a habit is completed for a given day based on its definition.
 * @param {string} key - The habit key.
 * @param {Object.<string, HabitData>} [dayData] - The day's habit data.
 * @returns {boolean} True if the habit is done.
 */
function isHabitDone(key, dayData) {
  if (!dayData || !dayData[key]) return false;
  const val = dayData[key];
  const def = HABIT_DEFS[key];
  if (!def) return false;
  // Skip archived habits
  if (def.archived) return false;

  switch (def.unit) {
    case 'boolean':
      return val.done === true;
    case 'count':
      if (def.decreasing) {
        const target = getHabitTarget(key);
        return val.count !== undefined && val.count <= target;
      }
      const wt = getHabitTarget(key);
      return val.count !== undefined && val.count >= wt;
    case 'minutes':
      const et = getHabitTarget(key);
      return val.minutes !== undefined && val.minutes >= et;
    case 'time':
      return val.time && val.time <= (getHabitTarget(key) || '07:00');
    case 'quality':
      return val.bedtime && val.bedtime <= (getHabitTarget(key) || '23:00');
    default:
      return false;
  }
}

/**
 * Gets the target value for a habit from goals settings.
 * @param {string} key - The habit key.
 * @returns {number|string} The target value.
 */
function getHabitTarget(key) {
  const goals = appData.settings.goals;
  // Check custom goals first
  if (goals.custom && goals.custom[key]) {
    return goals.custom[key].target;
  }
  // Default goals mapping
  const targetMap = {
    wakeUp: goals.wakeUpTarget || '07:00',
    exercise: goals.exerciseTarget || 20,
    sleep: goals.sleepTarget || '23:00',
    water: goals.waterTarget || 8,
    smoking: goals.smokingTarget || 15,
    learning: goals.learningTarget || 30,
    bike: 1 // boolean, just needs to be done
  };
  return targetMap[key] || 1;
}

/**
 * Simplified smoking target — just returns the static goal value.
 * The progressive reduction plan has been removed.
 * @returns {number} The smoking target count.
 */
function getSmokingTarget() {
  return getHabitTarget('smoking');
}

function getHabitCompletion(key, dayData) {
  if (isHabitDone(key, dayData)) return 1;
  if (!dayData || !dayData[key]) return 0;
  const val = dayData[key];
  const def = HABIT_DEFS[key];
  if (!def || def.archived) return 0;

  if (def.unit === 'count' && val.count !== undefined) {
    if (def.decreasing) {
      const target = getHabitTarget(key);
      return Math.max(0, 1 - (val.count / (target * 2)));
    }
    const wt = getHabitTarget(key);
    return Math.min(1, val.count / wt);
  }
  if (def.unit === 'minutes' && val.minutes !== undefined) {
    const target = getHabitTarget(key);
    return Math.min(1, val.minutes / target);
  }
  return 0;
}

// -- SVG Progress Ring --
function svgRing(pct, color, size, stroke) {
  size = size || 60; stroke = stroke || 5;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(1, Math.max(0, pct)));
  return `<svg width="${size}" height="${size}" style="transform: rotate(-90deg);">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

// سه حلقه هم‌مرکز — عنصر امضادار داشبورد: جسمی (بیرونی) / روانی (میانی) / رشد (درونی)
function svgHealthRings(catScores, size) {
  size = size || 168;
  const stroke = 12, gap = 4;
  const rOuter = (size - stroke) / 2;
  const rMid = rOuter - stroke - gap;
  const rInner = rMid - stroke - gap;
  const ring = (r, pct, color) => {
    const c = 2 * Math.PI * r;
    const offset = c * (1 - Math.min(1, Math.max(0, pct / 100)));
    return `<circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size}">
    ${ring(rOuter, catScores.physical, 'var(--physical)')}
    ${ring(rMid, catScores.mental, 'var(--mental)')}
    ${ring(rInner, catScores.growth, 'var(--growth)')}
  </svg>`;
}

/**
 * Calculates the daily health score (0-100) based on habit completions.
 * Uses dynamic category weights from HEALTH_CATEGORIES.
 * @param {Object.<string, HabitData>} dayData - The day's habit data.
 * @returns {number} Score between 0 and 100.
 */
function calcDayScore(dayData) {
  let score = 0;
  for (const [key, def] of Object.entries(HABIT_DEFS)) {
    if (def.archived) continue;
    const cat = def.category || 'growth';
    const catWeight = HEALTH_CATEGORIES[cat]?.weight || 10;
    // Normalize: each habit gets equal share of category weight
    // We'll calculate per-category and sum in calcCategoryScores
    // For overall score, use weighted average of category scores
  }
  // Delegate to category scores for consistent weighting
  const catScores = calcCategoryScores(dayData);
  let totalWeight = 0, weightedSum = 0;
  for (const [cat, pct] of Object.entries(catScores)) {
    const w = HEALTH_CATEGORIES[cat]?.weight || 0;
    weightedSum += pct * w;
    totalWeight += w;
  }
  return totalWeight > 0 ? Math.round(weightedSum / totalWeight) : 0;
}

// امتیاز هر دسته سلامت به‌طور جداگانه (برای حلقه‌های سه‌گانه در داشبورد)
// Uses dynamic category weights from HEALTH_CATEGORIES
function calcCategoryScores(dayData) {
  const totals = {}, maxes = {};
  // Initialize for all categories
  for (const cat of Object.keys(HEALTH_CATEGORIES)) {
    totals[cat] = 0;
    maxes[cat] = 0;
  }
  for (const [key, def] of Object.entries(HABIT_DEFS)) {
    if (def.archived) continue;
    const cat = def.category || 'growth';
    const weight = HABIT_WEIGHTS[key] || 10;
    const completion = getHabitCompletion(key, dayData);
    totals[cat] += weight * completion;
    maxes[cat] += weight;
  }
  const result = {};
  for (const cat of Object.keys(totals)) {
    result[cat] = maxes[cat] > 0 ? Math.round(Math.min(100, (totals[cat] / maxes[cat]) * 100)) : 0;
  }
  return result;
}

// میانگین متحرک ۷ روزه — دیدگاه بلندمدت‌تر به‌جای فشار all-or-nothing زنجیره روزها
function calc7DayAverage(endDate) {
  const end = endDate || new Date();
  let sum = 0, count = 0;
  for (let i = 0; i < 7; i++) {
    const d = jalali.addDays(end, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds];
    if (hd && Object.keys(hd).length > 0) {
      sum += calcDayScore(hd);
      count++;
    }
  }
  return count > 0 ? Math.round(sum / 7) : 0; // تقسیم بر ۷ ثابت، نه count، تا روزهای ثبت‌نشده هم به‌عنوان صفر لحاظ شوند
}

// -- GitHub-style streak calendar --
function renderStreakCalendar() {
  const today = new Date();
  const todayJ = jalali.g_to_j(today.getFullYear(), today.getMonth() + 1, today.getDate());

  // 12 weeks back from today (Jalali week: Sat=0)
  const startDate = jalali.addDays(today, -(12 * 7) + jalali.dayOfWeek(today));
  let html = '<div class="streak-calendar"><div style="overflow-x:auto;"><div style="display:flex;gap:3px;min-width:fit-content;">';

  // Day labels (first column)
  html += '<div class="calendar-row" style="flex-direction:column;">';
  for (let r = 0; r < 7; r++) {
    html += `<div class="calendar-day-label">${jalali.dayNames[r].substring(0, 1)}</div>`;
  }
  html += '</div>';

  // 12 weeks
  let d = new Date(startDate);
  for (let w = 0; w < 12; w++) {
    html += '<div class="calendar-row" style="flex-direction:column;">';
    for (let r = 0; r < 7; r++) {
      const ds = jalali.format(d);
      const isFuture = d > today;
      let cellClass = '';
      let tipText = ds;

      if (isFuture) {
        cellClass = 'future';
      } else {
        const hd = appData.habits[ds] || {};
        const keys = Object.keys(hd).filter(k => HABIT_DEFS[k]);
        if (keys.length === 0) {
          cellClass = 'red';
          tipText += ' - ثبت نشده';
        } else {
          const s = calcDayScore(hd);
          if (s >= 80) { cellClass = 'green'; tipText += ` - ${s} امتیاز`; }
          else if (s >= 40) { cellClass = 'yellow'; tipText += ` - ${s} امتیاز`; }
          else { cellClass = 'red'; tipText += ` - ${s} امتیاز`; }
        }
      }
      html += `<div class="calendar-cell ${cellClass}">
        <div class="tooltip">${tipText}</div>
      </div>`;
      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
  }

  html += '</div></div></div>';
  return html;
}

function trapFocus(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal) return;
  const focusable = modal.querySelectorAll('button, input, textarea, select');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  function keydown(e) {
    if (e.key !== 'Tab') return;
    if (e.shiftKey) {
      if (document.activeElement === first) {
        e.preventDefault(); last.focus();
      }
    } else {
      if (document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  }
  modal._trapKeydown = keydown;
  modal.addEventListener('keydown', keydown);
  // Focus first element on open
  setTimeout(() => first.focus(), 50);
}
function releaseFocusTrap(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal || !modal._trapKeydown) return;
  modal.removeEventListener('keydown', modal._trapKeydown);
  modal._trapKeydown = null;
}

    const decreasingGroup = document.getElementById('new-habit-decreasing-group');
    const reasonsGroup = document.getElementById('new-habit-reasons-group');

    unitSelect.addEventListener('change', () => {
      const unit = unitSelect.value;
      targetGroup.style.display = ['count', 'minutes', 'time', 'quality'].includes(unit) ? 'block' : 'none';
      decreasingGroup.style.display = unit === 'count' ? 'block' : 'none';
      reasonsGroup.style.display = (unit === 'count' && document.getElementById('new-habit-decreasing').checked) ? 'block' : 'none';

      // Update target placeholder
      const targetInput = document.getElementById('new-habit-target');
      if (unit === 'minutes') targetInput.placeholder = 'مثال: 20';
      else if (unit === 'count') targetInput.placeholder = 'مثال: 8';
      else if (unit === 'time') targetInput.placeholder = 'مثال: 07:00';
      else if (unit === 'quality') targetInput.placeholder = 'مثال: 23:00';
    });

    document.getElementById('new-habit-decreasing').addEventListener('change', (e) => {
      reasonsGroup.style.display = e.target.checked ? 'block' : 'none';
    });
  }

  // Action buttons
  document.getElementById('modal-left-actions').innerHTML = isNew ? '' :
    `<button class="btn btn-danger btn-sm" data-action="deleteHabitEntry" data-params='{"key":"${key}"}'>🗑️ حذف امروز</button>`;

  document.getElementById('modal-save').onclick = () => saveHabitModal(key, isNew);
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-overlay').setAttribute('data-habit', key);
  trapFocus('modal');
}

function closeModal() {
  releaseFocusTrap('modal');
  document.getElementById('modal-overlay').classList.remove('active');
}

// Modal helpers
let _modalExerciseType = 'walk';
let _modalLearningType = 'reading';
let _modalSleepQuality = 3;

function toggleModalBool(keyOrParams) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  const hd = getDayHabits(localDateStr());
  if (!hd[key]) hd[key] = {};

  const btn = document.querySelector('#modal-body .btn');
  if (btn) {
    btn.className = `btn ${hd[key].done ? 'btn-green' : ''}`;
    btn.textContent = hd[key].done ? '✓ انجام شده' : 'انجام نشده';
  }
}

function modalAdjust(keyOrParams, deltaOrUndefined) {
  let key, delta;
  if (typeof keyOrParams === 'object') { key = keyOrParams.key; delta = keyOrParams.delta; }
  else { key = keyOrParams; delta = deltaOrUndefined; }
  const hd = getDayHabits(localDateStr());
  if (!hd[key]) hd[key] = { count: 0 };
  hd[key].count = Math.max(0, (hd[key].count || 0) + delta);
  const val = document.querySelector('#modal-body .val');
  if (val) val.textContent = hd[key].count;
}

function selectExerciseType(typeOrParams) {

  document.getElementById('modal-exercise-type').value = type;
  document.querySelectorAll('#modal-body .exercise-types button').forEach(b => {

}

function selectLearningType(typeOrParams) {

  if (!type) return;
  _modalLearningType = type;
  document.getElementById('modal-learning-type').value = type;
  document.querySelectorAll('#modal-body .exercise-types button').forEach(b => {

}

function selectQuality(qOrParams) {
  const q = typeof qOrParams === 'object' ? qOrParams.q : qOrParams;
  _modalSleepQuality = q;
  document.getElementById('modal-sleep-quality').value = q;
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById('modal-quality-' + i);
    if (btn) btn.className = `btn btn-sm ${i === q ? 'btn-primary' : ''}`;

function saveHabitModal(key, isNew) {
  if (isNew) {
    const nameInput = document.getElementById('new-habit-name');
    const name = (nameInput ? nameInput.value : '').trim();
    if (!name) {
      toast('نام عادت را وارد کن', 'error');
      if (nameInput) nameInput.focus();
      return;
    }
    const icon = ((document.getElementById('new-habit-icon') || {}).value || '').trim() || '⭐';
    const color = (document.getElementById('new-habit-color') || {}).value || '#39d0d8';
    const unit = (document.getElementById('new-habit-unit') || {}).value || 'boolean';
    const category = (document.getElementById('new-habit-category') || {}).value || 'growth';
    const targetRaw = ((document.getElementById('new-habit-target') || {}).value || '').trim();
    const decreasing = unit === 'count' && !!(document.getElementById('new-habit-decreasing') || {}).checked;
    const reasonsRaw = (document.getElementById('new-habit-reasons') || {}).value || '';
    const reasons = reasonsRaw.split(',').map(r => r.trim()).filter(Boolean);

    const newKey = 'custom' + Date.now();
    const newDef = { name, icon, color, unit, category, isDefault: false, archived: false };

    if (unit !== 'boolean') {
      let targetVal;
      if (unit === 'minutes' || unit === 'count') {
        const n = parseInt(targetRaw, 10);
        targetVal = isNaN(n) ? (unit === 'minutes' ? 20 : 8) : n;
      } else {
        targetVal = targetRaw || (unit === 'time' ? '07:00' : '23:00');
      }
      newDef.defaultTarget = targetVal;
      if (!appData.settings.goals.custom) appData.settings.goals.custom = {};
      appData.settings.goals.custom[newKey] = { target: targetVal, unit, label: name };
    }
    if (decreasing) {
      newDef.decreasing = true;
      newDef.reasons = reasons.length ? reasons : ['استرس','عادت','خستگی','لذت','بیکاری','دیگر'];
    }

    if (!appData.settings.customHabits) appData.settings.customHabits = {};
    appData.settings.customHabits[newKey] = newDef;
    mergeCustomSettings();
    saveAll();
    closeModal();
    renderCurrentTab();
    toast(icon + ' عادت «' + name + '» اضافه شد', 'success');
    return;
  }

  const ds = localDateStr();
  const hd = getDayHabits(ds);
  const def = HABIT_DEFS[key];
  const notes = (document.getElementById('modal-notes') || {value:''}).value || '';
  const archived = (document.getElementById('modal-archived') || {checked:false}).checked;

  if (!hd[key]) hd[key] = {};

  switch (def.unit) {
    case 'boolean':
      // already toggled
      break;
    case 'count':
      if (def.decreasing) {
        hd[key].lastReason = (document.getElementById('modal-' + key + '-reason') || {value:''}).value || (def.reasons && def.reasons[0]) || 'عادت';
      }
      break;
    case 'minutes':
      hd[key].minutes = +(document.getElementById('modal-minutes-' + key) || {value:''}).value || 0;
      if (key === 'exercise') hd[key].type = _modalExerciseType;
      if (key === 'learning') hd[key].type = _modalLearningType;
      break;
    case 'time':
      hd[key].time = (document.getElementById('modal-wakeup-time') || {value:''}).value || '';
      break;
    case 'quality':
      hd[key].bedtime = (document.getElementById('modal-sleep-bedtime') || {value:''}).value || '';
      hd[key].waketime = (document.getElementById('modal-sleep-waketime') || {value:''}).value || '';
      hd[key].quality = _modalSleepQuality;
      break;
  }

  hd[key].notes = notes;

  // Handle archive toggle
  if (def.archived !== archived) {
    if (def.isDefault) {
      if (!appData.settings.customHabits[key]) {
        appData.settings.customHabits[key] = { ...def };
      }
      appData.settings.customHabits[key].archived = archived;
    } else {
      if (appData.settings.customHabits[key]) {
        appData.settings.customHabits[key].archived = archived;
      }
    }
    mergeCustomSettings();
  }

  saveAll();
  closeModal();
  renderCurrentTab();
  toast(def.icon + ' ذخیره شد', 'success');
}

function deleteCustomHabit(keyOrParams) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  const def = HABIT_DEFS[key];
  if (!def || def.isDefault) return; // Can't delete default habits

  if (!confirm(`آیا از حذف کامل عادت "${def.name}" مطمئنید؟ تاریخچه حفظ می‌شود.`)) return;

  // Remove from custom habits
  if (appData.settings.customHabits[key]) {
    delete appData.settings.customHabits[key];
  }
  // Remove from custom goals
  if (appData.settings.goals.custom && appData.settings.goals.custom[key]) {
    delete appData.settings.goals.custom[key];
  }

  mergeCustomSettings();
  saveAll();
  closeModal();
  renderCurrentTab();
  toast('🗑️ عادت سفارشی حذف شد (تاریخچه حفظ شد)', 'info');
}

// Generic delete with undo pattern
const _pendingDeletes = {};
function deleteWithUndo(description, restoreFn, permanentDeleteFn) {
  const id = 'del-' + Date.now();
  _pendingDeletes[id] = { restoreFn, permanentDeleteFn, description };
  const container = document.getElementById('toast-container');
  const toastEl = document.createElement('div');
  toastEl.className = 'toast toast-warning';
  toastEl.id = id;
  toastEl.innerHTML = `
    <span class="toast-icon">🗑️</span>
    <div class="toast-body">
      <div class="toast-msg">${escapeHtml(description)}</div>
      <div class="toast-sub">کلیک کنید یا ۸ ثانیه صبر کنید</div>
    </div>
    <div class="toast-actions">
      <button data-action="undoDelete" data-params='{"toastId":"${id}"}'>انصراف</button>
    </div>
    <button class="toast-close" data-action="dismissToast" data-params='{"id":"${id}"}'>✕</button>
  `;
  container.appendChild(toastEl);
  toastEl.style.display = 'flex';
  setTimeout(() => {
    const pending = _pendingDeletes[id];
    if (pending) {
      pending.permanentDeleteFn();
      delete _pendingDeletes[id];
      if (toastEl.parentNode) toastEl.remove();
      toast('حذف شد', 'info');
    }
  }, 8000);
}

function undoDelete(idOrParams) {
  const id = typeof idOrParams === 'string' ? idOrParams : (idOrParams && idOrParams.toastId);
  if (!id) return;
  const pending = _pendingDeletes[id];
  if (!pending) return;
  delete _pendingDeletes[id];
  const el = document.getElementById(id);
  if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 300); }
  pending.restoreFn();
  toast('↩️ بازگردانده شد', 'success');
}

function deleteHabitEntry(keyOrParams) {
  const key = typeof keyOrParams === 'string' ? keyOrParams : (keyOrParams && keyOrParams.key);
  if (!key) return;
  const ds = localDateStr();
  const hd = getDayHabits(ds);
  const backup = hd[key];
  if (!backup) return;
  // Use undo pattern
  const restoreFn = () => {
    const hd2 = getDayHabits(ds);
    hd2[key] = backup;
    saveAll();
    renderCurrentTab();
  };
  const permanentFn = () => {
    delete hd[key];
    saveAll();
    renderCurrentTab();
  };
  deleteWithUndo(`عادت "${HABIT_DEFS[key].name}" حذف شد`, restoreFn, permanentFn);
  closeModal();
}

function autoSaveJournal() {
  if (window._jsTimer) clearTimeout(window._jsTimer);
  window._jsTimer = setTimeout(()=>saveJournalEntry(), 1500);
}
function setJournalMood(nOrParams) {
  const n = typeof nOrParams === 'object' ? nOrParams.n : nOrParams;
  const jd = getDayJournal(localDateStr());
  jd.mood = n; saveAll(); renderJournal();
}
function toggleJournalTag(tagOrParams) {
  const tag = typeof tagOrParams === 'string' ? tagOrParams : (tagOrParams && tagOrParams.tag);
  if (!tag) return;
  const jd = getDayJournal(localDateStr());
  if (!jd.tags) jd.tags = [];
  const idx = jd.tags.indexOf(tag);
  if (idx >= 0) jd.tags.splice(idx, 1); else jd.tags.push(tag);
  saveAll(); renderJournal();
}
function saveJournalEntry() {
  const ds = localDateStr();
  const jd = getDayJournal(ds);
  jd.morning = (document.getElementById('j-morning') || {value:''}).value || '';
  jd.evening = (document.getElementById('j-evening') || {value:''}).value || '';
  const ma = [], ea = [];
  for (let i = 0; i < 3; i++) {
    const me = document.getElementById('j-morning-'+i);
    ma.push(me ? me.value : '');
    const ee = document.getElementById('j-evening-'+i);
    ea.push(ee ? ee.value : '');
  }
  jd.morningAnswers = ma; jd.eveningAnswers = ea;
  saveAll(); toast('📝 یادداشت ذخیره شد', 'success');
}
function clearJournalEntry() {
  const ds = localDateStr();
  const backup = appData.journal[ds];
  if (!backup) return;
  deleteWithUndo('یادداشت امروز پاک شد', () => {
    appData.journal[ds] = backup;
    saveAll(); renderJournal();
  }, () => {
    delete appData.journal[ds];
    saveAll(); renderJournal();
  });
}
function renderJournalList(panel) {
  let entries = Object.entries(appData.journal).sort((a,b)=>b[0].localeCompare(a[0]));
  if (journalSearchQuery) {
    const q = journalSearchQuery.toLowerCase();
    entries = entries.filter(([ds,jd]) => {
      const t = [jd.morning||'',jd.evening||'',...(jd.morningAnswers||[]),...(jd.eveningAnswers||[])].join(' ').toLowerCase();
      return t.includes(q);
    });
  }
  if (journalFilterMood > 0) entries = entries.filter(([,jd])=>jd.mood===journalFilterMood);
  if (journalFilterTags.length > 0) entries = entries.filter(([,jd])=>journalFilterTags.every(t=>(jd.tags||[]).includes(t)));
  if (journalFilterDateFrom) entries = entries.filter(([ds])=>ds>=journalFilterDateFrom);
  if (journalFilterDateTo) entries = entries.filter(([ds])=>ds<=journalFilterDateTo);
  // Calendar
  const today = new Date(selectedDate); // Use selectedDate instead of new Date()
  const todayJ = jalali.g_to_j(today.getFullYear(),today.getMonth()+1,today.getDate());
  const monthDays = jalali.getMonthDays(todayJ.jy, todayJ.jm);
  const firstDay = jalali.firstDayOfMonth(todayJ.jy, todayJ.jm);
  let calCells = '';
  for (let i=0;i<firstDay;i++) calCells += '<div class="day-cell"></div>';
  for (let d=1;d<=monthDays;d++) {
    const isToday = d===todayJ.jd;
    const jDate = jalali.format(jalali.jToJsDate(todayJ.jy,todayJ.jm,d));
    const hasJ = appData.journal[jDate] && (appData.journal[jDate].morning || appData.journal[jDate].evening || (appData.journal[jDate].morningAnswers||[]).some(a=>a) || (appData.journal[jDate].eveningAnswers||[]).some(a=>a));
    calCells += `<div class="day-cell ${isToday?'today':''}" style="${hasJ?'background:var(--purple);':''}" data-action="goToDate" data-params='{"dateStr":"${jDate}"}'>${d}${hasJ?'<div class="dot" style="background:var(--purple);"></div>':''}</div>`;

    <div class="empty-icon">📝</div>

function toggleFilterTag(tagOrParams) {
  const tag = typeof tagOrParams === 'object' ? tagOrParams.tag : tagOrParams;
  const idx = journalFilterTags.indexOf(tag);
  if (idx>=0) journalFilterTags.splice(idx,1); else journalFilterTags.push(tag);

function exportJournalMarkdown() {
  let md = '# ژورنال شخصی\n\n';
  const entries = Object.entries(appData.journal).sort((a,b)=>b[0].localeCompare(a[0]));
  for (const [ds,jd] of entries) {
    md += `## ${ds}\n\n`;
    if (jd.mood) md += `**حالت:** ${JOURNAL_MOOD_EMOJIS[jd.mood]} ${jd.mood}/10\n\n`;
    if (jd.tags&&jd.tags.length) md += `**برچسب‌ها:** ${jd.tags.join(', ')}\n\n`;
    if (jd.morningAnswers&&jd.morningAnswers.some(a=>a)) { md += '### صبح\n\n'; jd.morningAnswers.forEach((a,i)=>{if(a) md+=`**${JOURNAL_MORNING_PROMPTS[i]}**\n${a}\n\n`;}); }
    if (jd.morning) md += `**یادداشت صبح:**\n${jd.morning}\n\n`;
    if (jd.eveningAnswers&&jd.eveningAnswers.some(a=>a)) { md += '### شب\n\n'; jd.eveningAnswers.forEach((a,i)=>{if(a) md+=`**${JOURNAL_EVENING_PROMPTS[i]}**\n${a}\n\n`;}); }
    if (jd.evening) md += `**یادداشت شب:**\n${jd.evening}\n\n`;
    md += '---\n\n';
  }
  const blob = new Blob([md],{type:'text/markdown;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`journal-${localDateStr()}.md`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url); toast('📄 Markdown دانلود شد','success');
}

function getFinanceEntries(range) {
  const today = new Date();
  let entries = [];
  const dates = Object.keys(appData.finance).sort();
  for (const ds of dates) {
    const fd = appData.finance[ds];
    if (!fd || !fd.entries) continue;
    const p = jalali.parseJalali(ds);
    const jd = jalali.jToJsDate(p.jy, p.jm, p.jd);
    let include = false;
    if (range === 'daily') {
      include = (ds === localDateStr());
    } else if (range === 'weekly') {
      const diff = Math.floor((today - jd) / 86400000);
      include = diff >= 0 && diff < 7;
    } else if (range === 'monthly') {
      const sameMonth = jd.getMonth() === today.getMonth() && jd.getFullYear() === today.getFullYear();
      include = sameMonth;
    }
    if (include) {
      for (const e of fd.entries) {
        entries.push({...e, date: ds});
      }
    }
  }
  return entries;
}

function deleteFinanceEntryByParams(dateStrOrParams, idxOrUndefined) {
  let dateStr, idx;
  if (typeof dateStrOrParams === 'object' && dateStrOrParams) {
    dateStr = dateStrOrParams.dateStr; idx = dateStrOrParams.idx;
  } else {
    dateStr = dateStrOrParams; idx = idxOrUndefined;
  }
  deleteFinanceEntry(dateStr, idx);
}

function deleteFinanceEntry(dateStr, idx) {
  const fd = appData.finance[dateStr];
  if (!fd || !fd.entries) return;
  const backup = fd.entries[idx];
  if (!backup) return;
  deleteWithUndo(`تراکنش "${escapeHtml(backup.desc)}" حذف شد`, () => {
    fd.entries[idx] = backup;
    saveAll(); renderFinance();
  }, () => {
    fd.entries.splice(idx, 1);
    saveAll(); renderFinance();
  });
}

function renderAnalytics() {
  const panel = document.getElementById('tab-analytics');

  }

  const habitKeys = Object.keys(HABIT_DEFS);

  // --- GitHub-style 365-day Heatmap ---
  let heatmapHtml = '<div class="heatmap-container"><div class="heatmap-grid">';
  const dayLabels = ['ش','ی','د','س','چ','پ','ج']; // شنبه..جمعه (Jalali week, Sat=0)

  heatmapHtml += '</div>';
  d.heatmapData.forEach((cell, i) => {
    if (cell.dow === 0 && i < 364) heatmapHtml += '</div><div class="heatmap-row">';
    else if (cell.dow === 0 || i === 364) heatmapHtml += '<div class="heatmap-row">';
    heatmapHtml += `<div class="heatmap-cell" data-score="${cell.level}" title="${cell.ds}: ${cell.score}"></div>`;
  });
  heatmapHtml += '</div></div>';
  heatmapHtml += '<div class="heatmap-legend"><span>کم</span>';
  [0,1,2,3,4].forEach(l => { heatmapHtml += `<div class="heatmap-cell" data-score="${l}" style="cursor:default;"></div>`; });
  heatmapHtml += '<span>زیاد</span></div></div>';

  // --- Multi-line SVG Trend Chart ---
  const { scorePts, exPts, smokePts, trendW, trendH, trendPad } = d.trendData;
  let svgGrid = '';
  for (let y = 0; y <= 100; y += 25) {
    const yPos = trendH - trendPad - (y / 100) * (trendH - trendPad * 2);
    svgGrid += `<line x1="${trendPad}" y1="${yPos}" x2="${trendW - trendPad}" y2="${yPos}" stroke="#1e2a3a" stroke-width="0.5"/>`;
    svgGrid += `<text x="${trendPad - 5}" y="${yPos + 3}" fill="#5a6d82" font-size="9" text-anchor="end">${y}</text>`;
  }
  const trendSvg = `<svg viewBox="0 0 ${trendW} ${trendH}" xmlns="http://www.w3.org/2000/svg">
    ${svgGrid}
    <polyline points="${exPts.join(' ')}" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.7"/>
    <polyline points="${smokePts.join(' ')}" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.7"/>
    <polyline points="${scorePts.join(' ')}" fill="none" stroke="#39d0d8" stroke-width="2"/>
  </svg>`;

  // --- Pearson Correlation Matrix ---
  let corrHtml = `<div class="card mb-16"><div class="card-header"><span class="card-title">🔗 همبستگی عادت‌ها</span></div>`;
  corrHtml += `<div class="corr-matrix" style="grid-template-columns: 40px repeat(${habitKeys.length}, 1fr);">`;
  corrHtml += '<div></div>';
  habitKeys.forEach(k => { corrHtml += `<div class="corr-header">${HABIT_DEFS[k].icon}</div>`; });
  habitKeys.forEach(k1 => {
    corrHtml += `<div class="corr-header">${HABIT_DEFS[k1].icon}</div>`;
    habitKeys.forEach(k2 => {
      const v = d.corrMatrix[k1][k2];
      const abs = Math.abs(v);
      const color = v > 0 ? `rgba(63,185,80,${abs*0.8})` : `rgba(255,107,107,${abs*0.8})`;
      corrHtml += `<div class="corr-cell" style="background:${color};" title="${HABIT_DEFS[k1].name} × ${HABIT_DEFS[k2].name}: ${v.toFixed(2)}">${v.toFixed(2)}</div>`;
    });
  });
  corrHtml += '</div></div>';

  // --- Weekly Stats ---
  const { weekScores, weekMoods, weekExercises, weekSmoking, weekWater, weekSleep } = d;
  const wAvgScore = weekScores.length ? Math.round(weekScores.reduce((a,b)=>a+b,0)/weekScores.length) : 0;

  const wAvgWater = Math.round(weekWater.reduce((a,b)=>a+b,0)/7);
  const daysTracked = weekScores.filter(s => s > 0).length;

  // --- Auto-Generated Insights ---
  let insights = [];
  if (d.totalDays >= 7) {
    const recent7 = [];

      recent7.push(calcDayScore(appData.habits[jalali.format(jalali.addDays(today, -i))] || {}));
    }
    const prev7 = [];
    for (let i = 13; i >= 7; i--) {
      prev7.push(calcDayScore(appData.habits[jalali.format(jalali.addDays(today, -i))] || {}));
    }
    const rAvg = recent7.reduce((a,b)=>a+b,0)/7;
    const pAvg = prev7.length ? prev7.reduce((a,b)=>a+b,0)/7 : rAvg;

    else insights.push({icon:'➡️', text:'عملکرد شما نسبت به هفته قبل <strong>ثابت</strong> مانده.'});
  }
  if (wTotalSmoking > 0) {
    const goal = appData.settings.goals.smokingTarget || 3;
    if (wTotalSmoking / 7 > goal) insights.push({icon:'🚬', text:`میانگین سیگار روزانه <strong>${Math.round(wTotalSmoking/7)}</strong> بالاتر از هدف <strong>${goal}</strong> است.`});
    else insights.push({icon:'🎉', text:`میانگین سیگار روزانه <strong>${Math.round(wTotalSmoking/7)}</strong> در محدوده هدف <strong>${goal}</strong> است!`});
  }

    insights.push({icon:'🏃', text:`مجموع ورزش این هفته <strong>${wTotalExercise} دقیقه</strong> بوده.`});
  }
  if (wAvgWater < (appData.settings.goals.waterTarget || 8) * 0.7) {
    insights.push({icon:'💧', text:'مصرف آب شما کمتر از <strong>۷۰٪ هدف</strong> است. بیشتر بنوشید!'});
  }
  if (insights.length === 0) insights.push({icon:'💡', text:'داده کافی برای تولید بینش وجود ندارد. روزانه ثبت کنید!'});

  const achievementsHtml = d.achievements.map(a => `
    <div class="achievement-badge ${a.unlocked ? 'unlocked' : 'locked'}">

      <div class="ach-name">${a.name}</div>

    </div>`).join('');

  const habitBarsHtml = Object.entries(d.habitRates).map(([key, pct]) => {

      <span class="mono text-sm fw-600" style="min-width:36px;text-align:left;">${pct}%</span>
    </div>`;
  }).join('');

  const maxSmoke = Math.max(1, ...d.smokingData);
