<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"></noscript>
<style>
/* ========== CSS RESET & VARIABLES ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e14; --bg-elevated: #111820; --bg-hover: #1a2330;
  --bg-input: #0d1219; --border: #1e2a3a; --border-bright: #2a3f54;
  --text: #e8edf2; --text-dim: #8b9ab5; --text-faint: #5a6d82;
  --accent: #39d0d8; --green: #3fb950; --red: #ff6b6b;
  --amber: #f0883e; --purple: #a371f7; --gold: #ffd60a;
  --physical: #7fb3a0; --mental: #8b8fd6; --growth: #e8c07d;
  --coral: #ff6b9d; --sleep-color: #6b7fff;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --shadow: 0 4px 12px rgba(0,0,0,0.4); --transition: 150ms ease;
  --sidebar-w: 260px; --header-h: 56px;
}
html { font-size: 14px; }
body {
  font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  overflow: hidden; line-height: 1.6;
}
.mono { font-family: 'JetBrains Mono', monospace; }

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

/* ========== SIDEBAR ========== */
#sidebar {
  position: fixed; top: 0; right: 0; width: var(--sidebar-w);
  height: 100vh; background: var(--bg-elevated);
  border-left: 1px solid var(--border); z-index: 100;
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform var(--transition);
}
.sidebar-brand {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-brand .logo { font-size: 24px; }
.sidebar-brand h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
.sidebar-brand small { font-size: 11px; color: var(--text-faint); display: block; }
#sidebar nav { flex: 1; padding: 8px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-md);
  cursor: pointer; color: var(--text-dim); font-size: 14px;
  font-weight: 500; transition: all var(--transition);
  margin-bottom: 2px; -webkit-user-select: none; user-select: none;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-hover); color: var(--accent); font-weight: 600; }
.nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-faint);
}
.sidebar-footer button {
  display: block; width: 100%; padding: 8px; margin-top: 6px;
  background: var(--bg-hover); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: var(--radius-sm);
  cursor: pointer; font-family: inherit; font-size: 12px;
  transition: all var(--transition);
}
.sidebar-footer button:hover { background: var(--bg-input); color: var(--text); border-color: var(--border-bright); }
.sidebar-footer .danger { color: var(--red); }
.sidebar-footer .danger:hover { border-color: var(--red); }
#sidebar-overlay {
  display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.6);
  z-index: 99;
}

/* ========== HEADER ========== */
#header {
  position: fixed; top: 0; right: var(--sidebar-w); left: 0;
  height: var(--header-h); background: var(--bg-elevated);
  border-bottom: 1px solid var(--border); z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; transition: right var(--transition);
}
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right .date-info { font-size: 13px; color: var(--text-dim); }
.header-right .page-title { font-size: 18px; font-weight: 700; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left .slider-group {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim);
}
.header-left input[type="range"] {
  width: 80px; height: 4px; -webkit-appearance: none; background: var(--border);
  border-radius: 2px; outline: none; cursor: pointer;
}
.header-left input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}
.header-left .val {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--accent); min-width: 20px; text-align: center;
}
#hamburger {
  display: none; background: none; border: none; color: var(--text);
  font-size: 22px; cursor: pointer; padding: 4px;
}

/* ========== MAIN CONTENT ========== */
#main {
  position: fixed; top: var(--header-h); right: var(--sidebar-w);
  left: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px;
  transition: right var(--transition);
}
.tab-panel { display: none; animation: fadeIn 0.25s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== CARDS & WIDGETS ========== */
.card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  transition: all var(--transition);
}
.card:hover { border-color: var(--border-bright); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 700; }
.card-subtitle { font-size: 12px; color: var(--text-dim); }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.badge-accent { background: rgba(57,208,216,0.15); color: var(--accent); }
.badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
.badge-red { background: rgba(255,107,107,0.15); color: var(--red); }
.badge-amber { background: rgba(240,136,62,0.15); color: var(--amber); }
.badge-purple { background: rgba(163,113,247,0.15); color: var(--purple); }
.badge-soon { background: rgba(255,214,10,0.15); color: var(--gold); }

/* ========== BUTTONS ========== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-hover);
  color: var(--text); font-family: inherit; font-size: 13px;
  font-weight: 500; cursor: pointer; transition: all var(--transition);
  -webkit-user-select: none; user-select: none;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { opacity: 0.9; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-danger { color: var(--red); border-color: rgba(255,107,107,0.3); }
.btn-danger:hover { background: rgba(255,107,107,0.1); border-color: var(--red); }
.btn-green { background: var(--green); color: var(--bg); border-color: var(--green); }
.btn-green:hover { opacity: 0.9; }

/* ========== INPUTS ========== */
input[type="text"], input[type="time"], input[type="number"], textarea, select {
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm);
  padding: 8px 12px; font-family: inherit; font-size: 13px;
  width: 100%; outline: none; transition: border var(--transition);
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }
label { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; display: block; }
.form-group { margin-bottom: 14px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }

/* ========== HABIT CARDS GRID ========== */
.habits-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 24px;
}
.habit-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  cursor: pointer; transition: all var(--transition);
  position: relative; overflow: hidden;
}
.habit-card:hover { transform: translateY(-2px); border-color: var(--border-bright); box-shadow: var(--shadow); }
.habit-card.completed { border-color: var(--green); }
.habit-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.habit-card-name { display: flex; align-items: center; gap: 8px; }
.habit-card-name .icon { font-size: 20px; }
.habit-card-name .label { font-size: 14px; font-weight: 600; }
.habit-card-streak {
  background: rgba(255,214,10,0.12); color: var(--gold);
  padding: 2px 8px; border-radius: 12px; font-size: 11px;
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
}
.habit-card-ring { display: flex; justify-content: center; margin-bottom: 12px; }
.habit-card-actions { display: flex; align-items: center; justify-content: center; gap: 8px; }
.habit-card-actions .counter {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-input); padding: 4px 12px; border-radius: var(--radius-sm);
}
.habit-card-actions .counter button {
  background: none; border: none; color: var(--accent);
  font-size: 18px; cursor: pointer; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background var(--transition);
}
.habit-card-actions .counter button:hover { background: var(--bg-hover); }
.habit-card-actions .counter .val {
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  font-weight: 600; min-width: 30px; text-align: center;
}
.habit-card-actions select {
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm);
  padding: 4px 8px; font-size: 12px; font-family: inherit; width: auto;
}
.habit-card-actions input[type="time"] {
  width: 100px; text-align: center;
}

/* ========== SCORE RING ========== */
.score-ring-container { text-align: center; margin: 20px 0; }
.score-ring-label { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

/* ========== STREAK BAR ========== */
.streak-bar {
  display: flex; gap: 12px; padding: 16px; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  margin-bottom: 24px; overflow-x: auto;
}
.streak-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; min-width: 60px; flex-shrink: 0;
}
.streak-item .streak-icon { font-size: 18px; }
.streak-item .streak-num {
  font-family: 'JetBrains Mono', monospace; font-size: 16px;
  font-weight: 700; color: var(--gold);
}
.streak-item .streak-label { font-size: 10px; color: var(--text-faint); }

/* ========== STREAK CALENDAR ========== */
.streak-calendar {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; margin-bottom: 24px;
  overflow-x: auto;
}
.streak-calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.calendar-grid {
  display: grid; grid-template-rows: repeat(7, 1fr);
  gap: 3px;
}
.calendar-row { display: flex; gap: 3px; }
.calendar-day-label { font-size: 10px; color: var(--text-faint); width: 24px; text-align: center; padding: 2px 0; }
.calendar-cell {
  width: 14px; height: 14px; border-radius: 3px;
  background: var(--bg-hover); cursor: pointer;
  position: relative; transition: all var(--transition);
}
.calendar-cell:hover { transform: scale(1.3); z-index: 1; }
.calendar-cell.green { background: var(--green); }
.calendar-cell.yellow { background: var(--amber); }
.calendar-cell.red { background: var(--red); }
.calendar-cell.future { background: var(--border); opacity: 0.3; }
.calendar-cell .tooltip {
  display: none; position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%); background: var(--bg);
  border: 1px solid var(--border); padding: 6px 10px;
  border-radius: var(--radius-sm); font-size: 11px;
  white-space: nowrap; z-index: 10; pointer-events: none;
}
.calendar-cell:hover .tooltip { display: block; }

/* ========== MOOD SLIDERS ========== */
.mood-section {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  margin-bottom: 24px;
}
.mood-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px;
}
.mood-card label { font-size: 12px; margin-bottom: 8px; }
.mood-card .mood-val {
  font-family: 'JetBrains Mono', monospace; font-size: 20px;
  font-weight: 700; margin-bottom: 8px;
}
.mood-card input[type="range"] {
  width: 100%; -webkit-appearance: none; height: 4px;
  background: var(--border); border-radius: 2px; outline: none;
}
.mood-card input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg);
}

/* ========== MINI CALENDAR ========== */
.mini-cal {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
}
.mini-cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.mini-cal-header .month-label { font-size: 14px; font-weight: 600; }
.mini-cal-header button {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 16px; padding: 4px;
}
.mini-cal-header button:hover { color: var(--text); }
.mini-cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px; text-align: center;
}
.mini-cal-grid .day-name { font-size: 10px; color: var(--text-faint); padding: 4px; }
.mini-cal-grid .day-cell {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 6px 2px; border-radius: 6px; cursor: pointer;
  transition: background var(--transition);
}
.mini-cal-grid .day-cell:hover { background: var(--bg-hover); }
.mini-cal-grid .day-cell.today { border: 1px solid var(--accent); }
.mini-cal-grid .day-cell.has-data { position: relative; }
.mini-cal-grid .day-cell .dot {
  width: 4px; height: 4px; border-radius: 50%;
  display: inline-block; margin-top: 2px;
}

/* ========== DAY NAV ========== */
.day-nav {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-bottom: 20px;
}
.day-nav button {
  background: none; border: 1px solid var(--border);
  color: var(--text-dim); width: 36px; height: 36px;
  border-radius: 50%; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.day-nav button:hover { border-color: var(--accent); color: var(--accent); }
.day-nav .current-date {
  font-size: 15px; font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
}

/* ========== SETTINGS ========== */
.settings-grid { display: grid; gap: 20px; }
.setting-section {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
}
.setting-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-row .label { font-size: 13px; }
.toggle-row .desc { font-size: 11px; color: var(--text-faint); }
.toggle-switch {
  position: relative; width: 42px; height: 24px; flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-switch .slider {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: var(--border);
  border-radius: 12px; cursor: pointer; transition: var(--transition);
}
.toggle-switch .slider::before {
  content: ''; position: absolute; width: 18px; height: 18px;
  left: 3px; bottom: 3px; background: var(--text-dim);
  border-radius: 50%; transition: var(--transition);
}
.toggle-switch input:checked + .slider { background: var(--accent); }
.toggle-switch input:checked + .slider::before { transform: translateX(18px); background: white; }

/* ========== MODAL ========== */
#modal-overlay {
  display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.7);
  z-index: 200; justify-content: center; align-items: center;
}
#modal-overlay.active { display: flex; }
#modal {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px;
  width: 90%; max-width: 480px; max-height: 80vh;
  overflow-y: auto; animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
#modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
#modal-header h3 { font-size: 18px; font-weight: 700; }
#modal-close {
  background: none; border: none; color: var(--text-dim);
  font-size: 20px; cursor: pointer; padding: 4px;
}
#modal-close:hover { color: var(--text); }
#modal-footer { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
#modal-footer .left-actions { display: flex; gap: 8px; }

/* ========== TOAST ========== */
#toast-container {
  position: fixed; bottom: 20px; left: 20px;
  z-index: 300; display: flex; flex-direction: column;
  gap: 8px; max-width: 360px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-elevated); border: 1px solid var(--border-bright);
  border-radius: var(--radius-md); padding: 12px 16px;
  animation: toastIn 0.3s ease; box-shadow: var(--shadow);
}
.toast.removing { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
.toast-icon { font-size: 20px; flex-shrink: 0; }
.toast-body { flex: 1; }
.toast-msg { font-size: 13px; }
.toast-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.toast-actions { display: flex; gap: 6px; }
.toast-actions button {
  background: var(--bg-hover); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 11px; cursor: pointer; font-family: inherit;
}
.toast-actions button:hover { color: var(--text); border-color: var(--border-bright); }
.toast-close {
  background: none; border: none; color: var(--text-faint);
  cursor: pointer; font-size: 16px; padding: 2px;
}
.toast-close:hover { color: var(--text); }

/* ========== COMING SOON PLACEHOLDER ========== */
.placeholder-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 40px;
  text-align: center; max-width: 500px; margin: 40px auto;
}
.placeholder-card .big-icon { font-size: 48px; margin-bottom: 16px; }
.placeholder-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.placeholder-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }
.placeholder-card .features { text-align: right; margin-bottom: 20px; }
.placeholder-card .features li {
  color: var(--text-dim); font-size: 13px; padding: 4px 0;
  list-style: none;
}
.placeholder-card .features li::before { content: '✦ '; color: var(--accent); }

/* ========== DASHBOARD LAYOUT ========== */
.dash-top { display: flex; gap: 24px; margin-bottom: 24px; align-items: stretch; }
.dash-greeting { flex: 1; }

// ==========================================================
// 2. JALALI UTILS
// ==========================================================
const jalali = {
  monthNames: ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
  dayNames: ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
  _div(a, b) { return Math.floor(a / b); },
  _mod(a, b) { return a - b * Math.floor(a / b); },
  _gregorianDaysInMonth(gy, gm) {
    const m = [0,31,28,31,30,31,30,31,31,30,31,30,31];
    if (gm === 2 && ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0))) return 29;
    return m[gm];
  },
  g_to_j(gy, gm, gd) {
    const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    let gy2 = (gm > 2) ? gy + 1 : gy;
    let days = 355666 + (365 * gy) + this._div(gy2 + 3, 4) - this._div(gy2 + 99, 100)
             + this._div(gy2 + 399, 400) + gd + g_d_m[gm - 1];
    let jy = -1595 + (33 * this._div(days, 12053));
    days = this._mod(days, 12053);
    jy += 4 * this._div(days, 1461);
    days = this._mod(days, 1461);
    if (days > 365) {
      jy += this._div(days - 1, 365);
      days = this._mod(days - 1, 365);
    }
    let jm, jd;
    if (days < 186) { jm = 1 + this._div(days, 31); jd = 1 + this._mod(days, 31); }
    else { days -= 186; jm = 7 + this._div(days, 30); jd = 1 + this._mod(days, 30); }
    return { jy, jm, jd };
  },
  j_to_g(jy, jm, jd) {
    jy += 1595;
    let days = -355668 + (365 * jy) + this._div(jy, 33) * 8 + this._div(jy + 4, 1461)
             + this._mod(jm - 1, 6) * 31 + this._mod(jm, 6) * (jd - 1);
    let gy = 4 * this._div(days, 1461);
    days -= this._div(gy, 4) * 1461;
    if (days > 365) { gy += this._div(days - 1, 365); days = this._mod(days - 1, 365); }
    if (days < 166) { days += 1; }
    else { days += 1; }
    let gd = days;
    let gm = 1;
    const dim = [0,31,29,31,30,31,30,31,31,30,31,30,31];
    for (let i = 1; i <= 12; i++) {
      if (gd <= dim[i]) { gm = i; break; }
      gd -= dim[i];
    }
    return { gy, gm, gd };
  },
  days_in_month(jy, jm) {
    if (jm <= 6) return 31;
    if (jm <= 11) return 30;
    // 12th month: leap check
    return (this._mod(((jy + 19) * 35) / 33, 1) < 1) ? 30 : 29;
  },
  format(date, fmt) {
    fmt = fmt || 'YYYY/MM/DD';
    const j = this.g_to_j(date.getFullYear(), date.getMonth() + 1, date.getDate());
    const pad = n => String(n).padStart(2, '0');
    return fmt.replace('YYYY', j.jy).replace('MM', pad(j.jm)).replace('DD', pad(j.jd));
  },
  formatFull(date) {
    const j = this.g_to_j(date.getFullYear(), date.getMonth() + 1, date.getDate());
    const dow = date.getDay(); // 0=Sun
    const dayIndex = (dow + 1) % 7; // Sat=0, Sun=1, ...
    return `${this.dayNames[dayIndex]} ${j.jd} ${this.monthNames[j.jm - 1]} ${j.jy}`;
  },
  today() { return this.format(new Date()); },
  parseJalali(str) {
    // Parse "YYYY/MM/DD"
    const p = str.split('/');
    return { jy: +p[0], jm: +p[1], jd: +p[2] };
  },
  jToJsDate(jy, jm, jd) {
    const g = this.j_to_g(jy, jm, jd);
    return new Date(g.gy, g.gm - 1, g.gd);
  },
  addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  },
  getMonthDays(jy, jm) {
    return this.days_in_month(jy, jm);
  },
  firstDayOfMonth(jy, jm) {
    const g = this.j_to_g(jy, jm, 1);
    const d = new Date(g.gy, g.gm - 1, g.gd);
    return (d.getDay() + 1) % 7; // Sat=0
  }
};

// بینش هفتگی — اتصال ژورنال/حالت روحی به الگوهای رفتاری
// بر پایه ۳۰ روز اخیر، رابطه بین استرس/انرژی و عادت‌های کلیدی را پیدا می‌کند
function computeWeeklyInsights() {
  const insights = [];
  const today = new Date();
  const days = [];
  for (let i = 0; i < 30; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds];
    const mood = appData.mood[ds];
    if (hd && mood) days.push({ ds, hd, mood });
  }
  if (days.length < 6) return insights; // داده کافی برای الگوی معنادار نیست

  // ۱) رابطه استرس بالا و مصرف سیگار
  const highStressDays = days.filter(d => d.mood.stress >= 7);
  const lowStressDays = days.filter(d => d.mood.stress <= 4);
  if (highStressDays.length >= 3 && lowStressDays.length >= 3) {
    const avgSmokeHigh = highStressDays.reduce((s, d) => s + ((d.hd.smoking && d.hd.smoking.count) || 0), 0) / highStressDays.length;
    const avgSmokeLow = lowStressDays.reduce((s, d) => s + ((d.hd.smoking && d.hd.smoking.count) || 0), 0) / lowStressDays.length;
    if (avgSmokeHigh - avgSmokeLow >= 2) {
      insights.push(`در روزهای پراسترس، سیگار به‌طور میانگین ${Math.round(avgSmokeHigh - avgSmokeLow)} نخ بیشتر از روزهای آرام بوده. مدیریت استرس می‌تواند مستقیم روی سیگار اثر بگذارد.`);
    }
  }

  // ۲) رابطه خواب کم و انرژی پایین روز بعد
  const sleepDays = days.filter(d => d.hd.sleep && d.hd.sleep.bedtime);
  if (sleepDays.length >= 5) {
    const lateNights = sleepDays.filter(d => d.hd.sleep.bedtime > '23:30');
    const earlyNights = sleepDays.filter(d => d.hd.sleep.bedtime <= '23:30');
    if (lateNights.length >= 2 && earlyNights.length >= 2) {
      const avgEnergyLate = lateNights.reduce((s, d) => s + d.mood.energy, 0) / lateNights.length;
      const avgEnergyEarly = earlyNights.reduce((s, d) => s + d.mood.energy, 0) / earlyNights.length;
      if (avgEnergyEarly - avgEnergyLate >= 1.5) {
        insights.push(`در روزهایی که دیرتر از ۲۳:۳۰ خوابیده‌ای، سطح انرژی به‌طور محسوسی پایین‌تر بوده.`);
      }
    }
  }

  // ۳) رابطه ورزش و حالت روحی
  const exerciseDays = days.filter(d => d.hd.exercise && d.hd.exercise.minutes > 0);
  const noExerciseDays = days.filter(d => !d.hd.exercise || !d.hd.exercise.minutes);
  if (exerciseDays.length >= 3 && noExerciseDays.length >= 3) {
    const avgMoodEx = exerciseDays.reduce((s, d) => s + d.mood.mood, 0) / exerciseDays.length;
    const avgMoodNoEx = noExerciseDays.reduce((s, d) => s + d.mood.mood, 0) / noExerciseDays.length;
    if (avgMoodEx - avgMoodNoEx >= 1) {
      insights.push(`در روزهایی که ورزش کرده‌ای، حالت روحی به‌طور میانگین بهتر بوده — این رابطه در داده‌های خودت هم دیده می‌شود.`);
    }
  }

  return insights;
}

// -- Streak calculation --
function calcStreak(habitKey) {
  let streak = 0;
  const d = new Date();
  // Start from today, go backward
  while (true) {
    const ds = jalali.format(d);
    const hd = getDayHabits(ds);
    if (isHabitDone(habitKey, hd)) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (ds === localDateStr()) {
      // Today not done yet, still count from yesterday
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function calcBestStreak(habitKey) {
  let best = 0, cur = 0;
  // Go back 365 days
  const d = new Date();
  d.setDate(d.getDate() - 365);
  for (let i = 0; i < 366; i++) {
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (isHabitDone(habitKey, hd)) {
      cur++;
      if (cur > best) best = cur;
    } else {
      cur = 0;
    }
    d.setDate(d.getDate() + 1);
  }
  return best;
}

function isHabitDone(key, dayData) {
  if (!dayData || !dayData[key]) return false;
  const val = dayData[key];
  const def = HABIT_DEFS[key];
  if (!def) return false;

  switch (def.unit) {
    case 'boolean':
      return val.done === true;
    case 'count':
      if (key === 'smoking') {
        const target = getSmokingTarget();
        return val.count !== undefined && val.count <= target;
      }
      const wt = appData.settings.goals.waterTarget || 8;
      return val.count !== undefined && val.count >= wt;
    case 'minutes':
      const et = key === 'learning'
        ? (appData.settings.goals.learningTarget || 30)
        : (appData.settings.goals.exerciseTarget || 20);
      return val.minutes !== undefined && val.minutes >= et;
    case 'time':
      return val.time && val.time <= (appData.settings.goals.wakeUpTarget || '07:00');
    case 'quality':
      return val.bedtime && val.bedtime <= (appData.settings.goals.sleepTarget || '23:00');
    default:
      return false;
  }
}

function getSmokingTarget() {
  const g = appData.settings.goals;
  const start = g.smokingStart || 15;
  const target = g.smokingTarget || 3;
  const weeks = g.smokingWeeks || 12;
  const totalDays = weeks * 7;
  // Find start date (first day with smoking data)
  let startDate = null;
  const dates = Object.keys(appData.habits).sort();
  for (const ds of dates) {
    if (appData.habits[ds] && appData.habits[ds].smoking) {
      startDate = ds;
      break;
    }
  }
  if (!startDate) return start;
  const sd = jalali.parseJalali(startDate);
  const startJs = jalali.jToJsDate(sd.jy, sd.jm, sd.jd);
  const now = new Date();
  const daysSince = Math.max(0, Math.floor((now - startJs) / (1000 * 60 * 60 * 24)));
  const progress = Math.min(1, daysSince / totalDays);
  const current = Math.round(start - (start - target) * progress);
  return Math.max(target, current);
}

function getHabitCompletion(key, dayData) {
  if (isHabitDone(key, dayData)) return 1;
  if (!dayData || !dayData[key]) return 0;
  const val = dayData[key];
  const def = HABIT_DEFS[key];
  if (def.unit === 'count' && val.count !== undefined) {
    if (key === 'smoking') {
      const target = getSmokingTarget();
      return Math.max(0, 1 - (val.count / (target * 2)));
    }
    const wt = appData.settings.goals.waterTarget || 8;
    return Math.min(1, val.count / wt);
  }
  if (def.unit === 'minutes' && val.minutes !== undefined) {
    const target = key === 'learning'
      ? (appData.settings.goals.learningTarget || 30)
      : (appData.settings.goals.exerciseTarget || 20);
    return Math.min(1, val.minutes / target);
  }
  return 0;
}

// -- SVG Progress Ring --
function svgRing(pct, color, size, stroke) {
  size = size || 60; stroke = stroke || 5;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.min(1, Math.max(0, pct)));
  return `<svg width="${size}" height="${size}" style="transform: rotate(-90deg);">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      style="transition: stroke-dashoffset 0.6s ease;"/>
  </svg>`;
}

// سه حلقه هم‌مرکز — عنصر امضادار داشبورد: جسمی (بیرونی) / روانی (میانی) / رشد (درونی)
function svgHealthRings(catScores, size) {
  size = size || 168;
  const stroke = 12, gap = 4;
  const rOuter = (size - stroke) / 2;
  const rMid = rOuter - stroke - gap;
  const rInner = rMid - stroke - gap;
  const ring = (r, pct, color) => {
    const c = 2 * Math.PI * r;
    const offset = c * (1 - Math.min(1, Math.max(0, pct / 100)));
    return `<circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size}">
    ${ring(rOuter, catScores.physical, 'var(--physical)')}
    ${ring(rMid, catScores.mental, 'var(--mental)')}
    ${ring(rInner, catScores.growth, 'var(--growth)')}
  </svg>`;
}

// -- Daily Score --
function calcDayScore(dayData) {
  let score = 0;
  for (const [key, weight] of Object.entries(HABIT_WEIGHTS)) {
    const completion = getHabitCompletion(key, dayData);
    score += Math.round(weight * completion);
  }
  return Math.min(100, Math.max(0, score));
}

// امتیاز هر دسته سلامت به‌طور جداگانه (برای حلقه‌های سه‌گانه در داشبورد)
function calcCategoryScores(dayData) {
  const totals = { physical: 0, mental: 0, growth: 0 };
  const maxes = { physical: 0, mental: 0, growth: 0 };
  for (const [key, def] of Object.entries(HABIT_DEFS)) {
    const cat = def.category || 'growth';
    const weight = HABIT_WEIGHTS[key] || 10;
    const completion = getHabitCompletion(key, dayData);
    totals[cat] += weight * completion;
    maxes[cat] += weight;
  }
  const result = {};
  for (const cat of Object.keys(totals)) {
    result[cat] = maxes[cat] > 0 ? Math.round(Math.min(100, (totals[cat] / maxes[cat]) * 100)) : 0;
  }
  return result;
}

// میانگین متحرک ۷ روزه — دیدگاه بلندمدت‌تر به‌جای فشار all-or-nothing زنجیره روزها
function calc7DayAverage(endDate) {
  const end = endDate || new Date();
  let sum = 0, count = 0;
  for (let i = 0; i < 7; i++) {
    const d = jalali.addDays(end, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds];
    if (hd && Object.keys(hd).length > 0) {
      sum += calcDayScore(hd);
      count++;
    }
  }
  return count > 0 ? Math.round(sum / 7) : 0; // تقسیم بر ۷ ثابت، نه count، تا روزهای ثبت‌نشده هم به‌عنوان صفر لحاظ شوند
}

// -- GitHub-style streak calendar --
function renderStreakCalendar() {
  const today = new Date();
  const todayJ = jalali.g_to_j(today.getFullYear(), today.getMonth() + 1, today.getDate());

  // 12 weeks back from today
  const startDate = jalali.addDays(today, -(12 * 7) + (today.getDay() + 1) % 7);
  let html = '<div class="streak-calendar"><div style="overflow-x:auto;"><div style="display:flex;gap:3px;min-width:fit-content;">';

  // Day labels (first column)
  html += '<div class="calendar-row" style="flex-direction:column;">';
  for (let r = 0; r < 7; r++) {
    html += `<div class="calendar-day-label">${jalali.dayNames[r].substring(0, 1)}</div>`;
  }
  html += '</div>';

  // 12 weeks
  let d = new Date(startDate);
  for (let w = 0; w < 12; w++) {
    html += '<div class="calendar-row" style="flex-direction:column;">';
    for (let r = 0; r < 7; r++) {
      const ds = jalali.format(d);
      const isFuture = d > today;
      let cellClass = '';
      let tipText = ds;

      if (isFuture) {
        cellClass = 'future';
      } else {
        const hd = appData.habits[ds] || {};
        const keys = Object.keys(hd).filter(k => HABIT_DEFS[k]);
        if (keys.length === 0) {
          cellClass = 'red';
          tipText += ' - ثبت نشده';
        } else {
          const s = calcDayScore(hd);
          if (s >= 80) { cellClass = 'green'; tipText += ` - ${s} امتیاز`; }
          else if (s >= 40) { cellClass = 'yellow'; tipText += ` - ${s} امتیاز`; }
          else { cellClass = 'red'; tipText += ` - ${s} امتیاز`; }
        }
      }
      html += `<div class="calendar-cell ${cellClass}">
        <div class="tooltip">${tipText}</div>
      </div>`;
      d.setDate(d.getDate() + 1);
    }
    html += '</div>';
  }

  html += '</div></div></div>';
  return html;
}

// Modal helpers
let _modalExerciseType = 'walk';
let _modalSleepQuality = 3;

function toggleModalBool(key) {
  const hd = getDayHabits(localDateStr());
  if (!hd[key]) hd[key] = {};
  hd[key].done = !hd[key].done;
  const btn = document.querySelector('#modal-body .btn');
  if (btn) {
    btn.className = `btn ${hd[key].done ? 'btn-green' : ''}`;
    btn.textContent = hd[key].done ? '✓ انجام شده' : 'انجام نشده';
  }
}

function modalAdjust(key, delta) {
  const hd = getDayHabits(localDateStr());
  if (!hd[key]) hd[key] = { count: 0 };
  hd[key].count = Math.max(0, (hd[key].count || 0) + delta);
  const val = document.querySelector('#modal-body .val');
  if (val) val.textContent = hd[key].count;
}

function selectExerciseType(type) {
  _modalExerciseType = type;
  document.getElementById('modal-exercise-type').value = type;
  document.querySelectorAll('#modal-body .exercise-types button').forEach(b => {
    b.classList.toggle('active', b.textContent === EXERCISE_TYPES[type]);
  });
}

function selectQuality(q) {
  _modalSleepQuality = q;
  document.getElementById('modal-sleep-quality').value = q;
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById('modal-quality-' + i);
    if (btn) btn.className = `btn btn-sm ${i === q ? 'btn-primary' : ''}`;
  }
}

function saveHabitModal(key) {
  const ds = localDateStr();
  const hd = getDayHabits(ds);
  const def = HABIT_DEFS[key];
  const notes = (document.getElementById('modal-notes') || {value:''}).value || '';

  if (!hd[key]) hd[key] = {};

  switch (def.unit) {
    case 'boolean':
      // already toggled
      break;
    case 'count':
      if (key === 'smoking') {
        hd[key].lastReason = (document.getElementById('modal-smoking-reason') || {value:''}).value || 'عادت';
      }
      break;
    case 'minutes':
      hd[key].minutes = +(document.getElementById('modal-minutes-' + key) || {value:''}).value || 0;
      if (key === 'exercise') hd[key].type = _modalExerciseType;
      break;
    case 'time':
      hd[key].time = (document.getElementById('modal-wakeup-time') || {value:''}).value || '';
      break;
    case 'quality':
      hd[key].bedtime = (document.getElementById('modal-sleep-bedtime') || {value:''}).value || '';
      hd[key].waketime = (document.getElementById('modal-sleep-waketime') || {value:''}).value || '';
      hd[key].quality = _modalSleepQuality;
      break;
  }

  hd[key].notes = notes;
  saveAll();
  closeModal();
  renderCurrentTab();
  toast(def.icon + ' ذخیره شد', 'success');
}

function deleteHabitEntry(key) {
  if (!confirm('آیا از حذف این عادت برای امروز مطمئنید؟')) return;
  const ds = localDateStr();
  const hd = getDayHabits(ds);
  delete hd[key];
  saveAll();
  closeModal();
  renderCurrentTab();
  toast('حذف شد', 'info');
}

function exportJournalMarkdown() {
  let md = '# ژورنال شخصی\n\n';
  const entries = Object.entries(appData.journal).sort((a,b)=>b[0].localeCompare(a[0]));
  for (const [ds,jd] of entries) {
    md += `## ${ds}\n\n`;
    if (jd.mood) md += `**حالت:** ${JOURNAL_MOOD_EMOJIS[jd.mood]} ${jd.mood}/10\n\n`;
    if (jd.tags&&jd.tags.length) md += `**برچسب‌ها:** ${jd.tags.join(', ')}\n\n`;
    if (jd.morningAnswers&&jd.morningAnswers.some(a=>a)) { md += '### صبح\n\n'; jd.morningAnswers.forEach((a,i)=>{if(a) md+=`**${JOURNAL_MORNING_PROMPTS[i]}**\n${a}\n\n`;}); }
    if (jd.morning) md += `**یادداشت صبح:**\n${jd.morning}\n\n`;
    if (jd.eveningAnswers&&jd.eveningAnswers.some(a=>a)) { md += '### شب\n\n'; jd.eveningAnswers.forEach((a,i)=>{if(a) md+=`**${JOURNAL_EVENING_PROMPTS[i]}**\n${a}\n\n`;}); }
    if (jd.evening) md += `**یادداشت شب:**\n${jd.evening}\n\n`;
    md += '---\n\n';
  }
  const blob = new Blob([md],{type:'text/markdown;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`journal-${localDateStr()}.md`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url); toast('📄 Markdown دانلود شد','success');
}

  const today = new Date();
  let entries = [];
  const dates = Object.keys(appData.finance).sort();
  for (const ds of dates) {
    const fd = appData.finance[ds];
    if (!fd || !fd.entries) continue;
    const p = jalali.parseJalali(ds);
    const jd = jalali.jToJsDate(p.jy, p.jm, p.jd);
    let include = false;
    if (range === 'daily') {
      include = (ds === localDateStr());
    } else if (range === 'weekly') {
      const diff = Math.floor((today - jd) / 86400000);
      include = diff >= 0 && diff < 7;
    } else if (range === 'monthly') {
      const sameMonth = jd.getMonth() === today.getMonth() && jd.getFullYear() === today.getFullYear();
      include = sameMonth;
    }
    if (include) {
      for (const e of fd.entries) {
        entries.push({...e, date: ds});
      }
    }
  }
  return entries;
}

function updateAsset(key, val) {

function addFinanceEntry() {
  const type = document.getElementById('fin-type').value;

  const desc = document.getElementById('fin-desc').value;
  const category = document.getElementById('fin-category').value;
  const time = document.getElementById('fin-time').value;
  if (!amount || amount <= 0) { toast('مبلغ را وارد کنید','error'); return; }
  const fd = getDayFinance(localDateStr());
  fd.entries.push({ type, amount, desc: desc||category, category, time: time||undefined });
  saveAll(); renderFinance(); toast('💰 تراکنش ثبت شد','success');
}

function deleteFinanceEntry(dateStr, idx) {
  const fd = appData.finance[dateStr];
  if (fd && fd.entries) { fd.entries.splice(idx, 1); saveAll(); renderFinance(); }
}

function renderAnalytics() {
  const panel = document.getElementById('tab-analytics');
  const today = new Date();
  const trackedDates = Object.keys(appData.habits).filter(d => Object.keys(appData.habits[d]).length > 0);
  const totalDays = trackedDates.length;
  let allScores = trackedDates.map(d => calcDayScore(appData.habits[d]));
  const avgScore = allScores.length ? Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length) : 0;
  let bestOverallStreak = 0, cur = 0;
  for (let i = 0; i < 365; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (Object.keys(hd).length > 0) { cur++; if (cur > bestOverallStreak) bestOverallStreak = cur; }
    else cur = 0;
  }

  // --- GitHub-style 365-day Heatmap ---
  let heatmapHtml = '<div class="heatmap-container"><div class="heatmap-grid">';
  const dayLabels = ['ش','ی','د','س','چ','پ','ج'];
  heatmapHtml += '<div class="heatmap-labels" style="padding-right:0;">';
  dayLabels.forEach(l => { heatmapHtml += `<span>${l}</span>`; });
  heatmapHtml += '</div>';
  for (let i = 364; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    const score = Object.keys(hd).length > 0 ? calcDayScore(hd) : 0;
    const level = score === 0 ? 0 : score <= 25 ? 1 : score <= 50 ? 2 : score <= 75 ? 3 : 4;
    const dayOfWeek = (d.getDay() + 1) % 7;
    if (dayOfWeek === 0 && i < 364) heatmapHtml += '</div><div class="heatmap-row">';
    else if (dayOfWeek === 0 || i === 364) heatmapHtml += '<div class="heatmap-row">';
    heatmapHtml += `<div class="heatmap-cell" data-score="${level}" title="${ds}: ${score}"></div>`;
  }
  heatmapHtml += '</div></div>';
  heatmapHtml += '<div class="heatmap-legend"><span>کم</span>';
  [0,1,2,3,4].forEach(l => { heatmapHtml += `<div class="heatmap-cell" data-score="${l}" style="cursor:default;"></div>`; });
  heatmapHtml += '<span>زیاد</span></div></div>';

  // --- Multi-line SVG Trend Chart (30 days: score, exercise, inverse smoking) ---
  const trendW = 500, trendH = 150, trendPad = 30;
  const trendDays = 30;
  let scorePts = [], exPts = [], smokePts = [];
  for (let i = trendDays - 1; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    const sc = calcDayScore(hd);
    const ex = hd.exercise ? Math.min(100, ((hd.exercise.minutes || 0) / 60) * 100) : 0;
    const sm = hd.smoking ? Math.max(0, 100 - ((hd.smoking.count || 0) / 20) * 100) : 100;
    const x = trendPad + ((trendDays - 1 - i) / (trendDays - 1)) * (trendW - trendPad * 2);
    scorePts.push(`${x},${trendH - trendPad - (sc / 100) * (trendH - trendPad * 2)}`);
    exPts.push(`${x},${trendH - trendPad - (ex / 100) * (trendH - trendPad * 2)}`);
    smokePts.push(`${x},${trendH - trendPad - (sm / 100) * (trendH - trendPad * 2)}`);
  }
  let svgGrid = '';
  for (let y = 0; y <= 100; y += 25) {
    const yPos = trendH - trendPad - (y / 100) * (trendH - trendPad * 2);
    svgGrid += `<line x1="${trendPad}" y1="${yPos}" x2="${trendW - trendPad}" y2="${yPos}" stroke="#1e2a3a" stroke-width="0.5"/>`;
    svgGrid += `<text x="${trendPad - 5}" y="${yPos + 3}" fill="#5a6d82" font-size="9" text-anchor="end">${y}</text>`;
  }
  const trendSvg = `<svg viewBox="0 0 ${trendW} ${trendH}" xmlns="http://www.w3.org/2000/svg">
    ${svgGrid}
    <polyline points="${exPts.join(' ')}" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.7"/>
    <polyline points="${smokePts.join(' ')}" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.7"/>
    <polyline points="${scorePts.join(' ')}" fill="none" stroke="#39d0d8" stroke-width="2"/>
  </svg>`;

  // --- Pearson Correlation Heatmap ---
  const habitKeys = Object.keys(HABIT_DEFS);
  const corrData = {};
  habitKeys.forEach(k => { corrData[k] = []; });
  const corrDates = [];
  for (let i = 29; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    corrDates.push(ds);
  }
  // Build value arrays for each habit
  const habitValues = {};
  habitKeys.forEach(k => {
    habitValues[k] = corrDates.map(ds => {
      const hd = appData.habits[ds] || {};
      const val = hd[k];
      if (!val) return 0;
      if (HABIT_DEFS[k].unit === 'boolean') return val.done ? 1 : 0;
      if (HABIT_DEFS[k].unit === 'count') return val.count || 0;
      if (HABIT_DEFS[k].unit === 'minutes') return val.minutes || 0;
      if (HABIT_DEFS[k].unit === 'time') return val.time ? (24 - parseInt(val.time)) : 0;
      if (HABIT_DEFS[k].unit === 'quality') return val.quality || 5;
      return 0;
    });
  });
  function pearson(x, y) {
    const n = x.length;
    if (n === 0) return 0;
    const mx = x.reduce((a,b)=>a+b,0)/n, my = y.reduce((a,b)=>a+b,0)/n;
    let num = 0, dx = 0, dy = 0;
    for (let i = 0; i < n; i++) {
      const a = x[i]-mx, b = y[i]-my;
      num += a*b; dx += a*a; dy += b*b;
    }
    const denom = Math.sqrt(dx*dy);
    return denom === 0 ? 0 : num/denom;
  }
  const corrMatrix = {};
  habitKeys.forEach(k1 => {
    corrMatrix[k1] = {};
    habitKeys.forEach(k2 => {
      corrMatrix[k1][k2] = pearson(habitValues[k1], habitValues[k2]);
    });
  });
  let corrHtml = `<div class="card mb-16"><div class="card-header"><span class="card-title">🔗 همبستگی عادت‌ها</span></div>`;
  const gridCols = habitKeys.length + 1;
  corrHtml += `<div class="corr-matrix" style="grid-template-columns: 40px repeat(${habitKeys.length}, 1fr);">`;
  corrHtml += '<div></div>';
  habitKeys.forEach(k => { corrHtml += `<div class="corr-header">${HABIT_DEFS[k].icon}</div>`; });
  habitKeys.forEach(k1 => {
    corrHtml += `<div class="corr-header">${HABIT_DEFS[k1].icon}</div>`;
    habitKeys.forEach(k2 => {
      const v = corrMatrix[k1][k2];
      const abs = Math.abs(v);
      const color = v > 0 ? `rgba(63,185,80,${abs*0.8})` : `rgba(255,107,107,${abs*0.8})`;
      corrHtml += `<div class="corr-cell" style="background:${color};" title="${HABIT_DEFS[k1].name} × ${HABIT_DEFS[k2].name}: ${v.toFixed(2)}">${v.toFixed(2)}</div>`;
    });
  });
  corrHtml += '</div></div>';

  // --- Weekly Stats Summary Cards ---
  let weekScores = [], weekMoods = [], weekExercises = [], weekSmoking = [];
  let weekWater = [], weekSleep = [];
  for (let i = 6; i >= 0; i--) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    weekScores.push(calcDayScore(hd));
    weekMoods.push((appData.mood[ds] || {mood:5}).mood);
    weekExercises.push(hd.exercise ? (hd.exercise.minutes || 0) : 0);
    weekSmoking.push(hd.smoking ? (hd.smoking.count || 0) : 0);
    weekWater.push(hd.water ? (hd.water.count || 0) : 0);
    weekSleep.push(hd.sleep ? (hd.sleep.bedtime || '-') : '-');
  }
  const wAvgScore = weekScores.length ? Math.round(weekScores.reduce((a,b)=>a+b,0)/weekScores.length) : 0;
  const wTotalExercise = weekExercises.reduce((a,b)=>a+b,0);
  const wTotalSmoking = weekSmoking.reduce((a,b)=>a+b,0);
  const wAvgWater = Math.round(weekWater.reduce((a,b)=>a+b,0)/7);
  const daysTracked = weekScores.filter(s => s > 0).length;

  // --- Auto-Generated Insights ---
  let insights = [];
  if (totalDays >= 7) {
    const recent7 = [];
    for (let i = 6; i >= 0; i--) {
      recent7.push(calcDayScore(appData.habits[jalali.format(jalali.addDays(today, -i))] || {}));
    }
    const prev7 = [];
    for (let i = 13; i >= 7; i--) {
      prev7.push(calcDayScore(appData.habits[jalali.format(jalali.addDays(today, -i))] || {}));
    }
    const rAvg = recent7.reduce((a,b)=>a+b,0)/7;
    const pAvg = prev7.length ? prev7.reduce((a,b)=>a+b,0)/7 : rAvg;
    if (rAvg > pAvg + 5) insights.push({icon:'📈', text:`عملکرد شما نسبت به هفته قبل <strong>${Math.round(rAvg - pAvg)} امتیاز بهتر</strong> شده!`});
    else if (rAvg < pAvg - 5) insights.push({icon:'📉', text:`عملکرد شما نسبت به هفته قبل <strong>${Math.round(pAvg - rAvg)} امتیاز کمتر</strong> شده. تلاش کنید!`});
    else insights.push({icon:'➡️', text:'عملکرد شما نسبت به هفته قبل <strong>ثابت</strong> مانده.'});
  }
  if (wTotalSmoking > 0) {
    const goal = appData.settings.goals.smokingTarget || 3;
    if (wTotalSmoking / 7 > goal) insights.push({icon:'🚬', text:`میانگین سیگار روزانه <strong>${Math.round(wTotalSmoking/7)}</strong> بالاتر از هدف <strong>${goal}</strong> است.`});
    else insights.push({icon:'🎉', text:`میانگین سیگار روزانه <strong>${Math.round(wTotalSmoking/7)}</strong> در محدوده هدف <strong>${goal}</strong> است!`});

  const achievements = checkAchievements();

  // --- Habit completion rates (30 days) ---
  let habitRates = {};

  let habitBarsHtml = Object.entries(habitRates).map(([key, pct]) => {

// 9b. ACHIEVEMENTS SYSTEM (Phase 3)
// ==========================================================
function checkAchievements() {
  const today = new Date();
  const trackedDates = Object.keys(appData.habits).filter(d => Object.keys(appData.habits[d]).length > 0);
  const totalDays = trackedDates.length;
  let bestStreak = 0, cur = 0;
  for (let i = 0; i < 365; i++) {
    const d = jalali.addDays(today, -i);
    const ds = jalali.format(d);
    const hd = appData.habits[ds] || {};
    if (Object.keys(hd).length > 0) { cur++; if (cur > bestStreak) bestStreak = cur; }
    else cur = 0;
  }
  // Total exercise minutes
  let totalExercise = 0, totalCigarettes = 0, totalWater = 0;
  trackedDates.forEach(ds => {
    const hd = appData.habits[ds] || {};
    if (hd.exercise) totalExercise += hd.exercise.minutes || 0;
    if (hd.smoking) totalCigarettes += hd.smoking.count || 0;
    if (hd.water) totalWater += hd.water.count || 0;
  });
  // Perfect days (score >= 90)
  let perfectDays = trackedDates.filter(d => calcDayScore(appData.habits[d]) >= 90).length;
  // Smoking free days
  let smokeFreeDays = trackedDates.filter(d => {
    const hd = appData.habits[d] || {};
    return hd.smoking && hd.smoking.count === 0;
  }).length;

  return [
    { id: 'first-day', icon: '🌱', name: 'اولین قدم', desc: 'اولین روز ثبت', unlocked: totalDays >= 1 },
    { id: 'week-streak', icon: '🔥', name: 'استریک یک هفته', desc: '۷ روز متوالی ثبت', unlocked: bestStreak >= 7 },
    { id: 'month-streak', icon: '💪', name: 'استریک یک ماه', desc: '۳۰ روز متوالی ثبت', unlocked: bestStreak >= 30 },
    { id: 'perfect-day', icon: '⭐', name: 'روز بی‌نقص', desc: 'امتیاز ۹۰+ در یک روز', unlocked: perfectDays >= 1 },
    { id: '100-hours', icon: '🏃', name: 'صد ساعت ورزش', desc: 'مجموع ۱۰۰ ساعت ورزش', unlocked: totalExercise >= 6000 },
    { id: 'smoke-free', icon: '🚭', name: 'بدون سیگار', desc: '۷ روز بدون سیگار', unlocked: smokeFreeDays >= 7 },
    { id: 'data-lover', icon: '📊', name: 'عاشق داده', desc: '۶۰ روز ثبت', unlocked: totalDays >= 60 }
  ];
}

function copyPrompt(el) {
  const text = el.querySelector('.prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    toast('📋 پرامپت کپی شد', 'success');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('📋 پرامپت کپی شد', 'success');
  });
}

// 11. REMINDERS (engine + toast)
// ==========================================================
let reminderInterval = null;

function startReminderEngine() {
  if (reminderInterval) clearInterval(reminderInterval);
  reminderInterval = setInterval(checkReminders, 60000);
  checkReminders(); // Check immediately
}

function checkReminders() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const currentTime = hours + ':' + minutes;

  const reminders = appData.settings.reminders;
  const lastReminded = appData.reminders.lastReminded || {};
  const todayStr = localDateStr();

  for (const [key, rem] of Object.entries(reminders)) {
    if (!rem.enabled) continue;
    if (rem.time === currentTime) {
      const reminderKey = todayStr + ':' + key;
      if (lastReminded[reminderKey]) continue;

      // Fire reminder
      lastReminded[reminderKey] = now.getTime();
      appData.reminders.lastReminded = lastReminded;
      saveAll();

      const def = HABIT_DEFS[key];
      const icon = def ? def.icon : '⏰';
      const msg = rem.msg || 'یادآوری';

      toast(msg, 'reminder', icon, () => {
        switchTab('dashboard');
      });
      playBeep();
    }
  }
}

function playBeep(frequency, duration) {
  frequency = frequency || 440;
  duration = duration || 200;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = frequency;
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000);
  } catch (e) {
    // Audio not available
  }
}

// ==========================================================
// 12. TOAST NOTIFICATIONS (Phase 3 - Enhanced)
// ==========================================================
function toast(msg, type, icon, action) {
  type = type || 'info';
  const container = document.getElementById('toast-container');
  const id = 'toast-' + Date.now();

  const icons = { success: '✅', error: '❌', info: 'ℹ️', reminder: '⏰', smart: '🤖' };
  const toastIcon = icon || icons[type] || 'ℹ️';

  const toastEl = document.createElement('div');
  toastEl.className = 'toast toast-' + type;
  toastEl.id = id;
  toastEl.innerHTML = `
    <span class="toast-icon">${toastIcon}</span>
    <div class="toast-body">
      <div class="toast-msg">${msg}</div>
    </div>
    <div class="toast-actions">
      ${action ? '<button onclick="document.getElementById(\'' + id + '\').remove();(' + action.toString() + ')()">ثبت کن</button>' : ''}
    </div>
    <button class="toast-close" onclick="dismissToast('${id}')">✕</button>
  `;

  container.appendChild(toastEl);

  // Auto-dismiss after 5 seconds
  setTimeout(() => dismissToast(id), 5000);
}

function dismissToast(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('removing');
  setTimeout(() => el.remove(), 300);
}

// Smart toast with time-based contextual messages
function smartToast(action) {
  const hour = new Date().getHours();
  const ds = localDateStr();
  const hd = appData.habits[ds] || {};
  const messages = [];

  if (action === 'morning') {
    if (hour >= 5 && hour < 9) {
      if (!hd.wakeUp) messages.push({icon:'☀️', msg:'صبح بخیر! ساعت بیداری امروز را ثبت کنید.', type:'smart'});
      else messages.push({icon:'👍', msg:'ساعت بیداری ثبت شده. روز خوبی داشته باشید!', type:'success'});
    }
  } else if (action === 'exercise') {
    if (hour >= 16 && hour < 20 && !hd.exercise) {
      messages.push({icon:'🏃', msg:'وقت ورزش است! چند دقیقه ورزش کردید؟', type:'smart'});
    }
  } else if (action === 'sleep') {
    if (hour >= 22 || hour < 2) {
      if (!hd.sleep) messages.push({icon:'🌙', msg:'ساعت خواب فرا رسیده. خواب خوب داشته باشید!', type:'smart'});
    }
  } else if (action === 'water') {
    if (hour >= 9 && hour < 18 && hd.water && (hd.water.count || 0) < 4) {
      messages.push({icon:'💧', msg:'فقط ' + (hd.water.count||0) + ' لیوان آب نوشیدید. بیشتر بنوشید!', type:'smart'});
    }
  }

  messages.forEach(m => toast(m.msg, m.type, m.icon));
}

// 13. BACKUP (download/upload/auto)
// ==========================================================
function downloadBackup() {
  const data = loadAllDataForBackup();
  const backup = { exportedAt: new Date().toISOString(), version: 1, data };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-assist-${localDateStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('⬇️ بکاپ دانلود شد', 'success');
}

function loadAllDataForBackup() {
  return appData;
}

function restoreBackup(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const backup = JSON.parse(e.target.result);
      if (backup.version !== 1) {
        toast('نسخه فایل نامعتبر', 'error');
        return;
      }
      if (!confirm('تمام داده‌های فعلی جایگزین می‌شوند. مطمئنید؟')) return;
      appData = backup.data;
      saveAll();
      renderAll();
      toast('✅ بازیابی با موفقیت انجام شد', 'success');
    } catch (err) {
      toast('خطا در خواندن فایل', 'error');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
}

function autoBackup() {
  if (!appData.settings.backup.autoBackup) return;
  const lastBackupKey = 'life_assist_last_backup';
  const lastBackup = localStorage.getItem(lastBackupKey);
  const today = localDateStr();
  if (lastBackup === today) return;

  downloadBackup();
  localStorage.setItem(lastBackupKey, today);
}

function exportHabitsCSV() {
  let csv = 'تاریخ,عادت,وضعیت,مقدار\n';
  const dates = Object.keys(appData.habits).sort();
  for (const ds of dates) {
    const hd = appData.habits[ds];
    for (const [key, val] of Object.entries(hd)) {
      const def = HABIT_DEFS[key];
      if (!def) continue;
      let status = isHabitDone(key, hd) ? 'انجام شده' : 'انجام نشده';
      let value = '';
      if (def.unit === 'boolean') value = val.done ? 'بله' : 'خیر';
      else if (def.unit === 'count') value = val.count || 0;
      else if (def.unit === 'minutes') value = val.minutes || 0;
      else if (def.unit === 'time') value = val.time || '';
      else if (def.unit === 'quality') value = (val.bedtime || '') + ' / ' + (val.quality || '');
      csv += `${ds},${def.name},${status},${value}\n`;
    }
  }
  downloadCSV(csv, `habits-${localDateStr()}.csv`);
}

function exportFinanceCSV() {
  let csv = 'تاریخ,نوع,مبلغ,توضیح,دسته\n';
  const dates = Object.keys(appData.finance).sort();
  for (const ds of dates) {
    const fd = appData.finance[ds];
    for (const e of fd.entries) {
      csv += `${ds},${e.type === 'income' ? 'درآمد' : 'هزینه'},${e.amount},"${e.desc}",${e.category || ''}\n`;
    }
  }
  downloadCSV(csv, `finance-${localDateStr()}.csv`);
}

function downloadCSV(csv, filename) {
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('📊 فایل CSV دانلود شد', 'success');
}

      totalDays: tracked.length,

      totalAchievements: 7
    };
  }
};

// 16. INIT (load, render, start) - Phase 3 Enhanced
// ==========================================================
function init() {
  try {
  var _err=document.getElementById("js-error");if(_err)_err.style.display="none";
  loadAll();
  renderAll();
  startReminderEngine();
  autoBackup();

  // Phase 3: Enhanced Keyboard Shortcuts
  document.addEventListener('keydown', (e) => {
    // Don't trigger if typing in an input
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    // Escape: close modal
    if (e.key === 'Escape') {
      closeModal();
      return;
    }

    // Ctrl+S: download backup
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      downloadBackup();
      return;
    }

    // Number keys 1-7: switch tabs
    const tabKeys = {'1':'dashboard','2':'habits','3':'journal','4':'finance','5':'analytics','6':'aihelp','7':'settings'};
    if (tabKeys[e.key]) {
      switchTab(tabKeys[e.key]);
      return;
    }

    // Space: toggle selected habit (on habits tab)
    if (e.key === ' ' && currentTab === 'habits') {
      e.preventDefault();
      // Try to find first unchecked habit and toggle it
      const today = localDateStr();
      const dayData = getDayHabits(today);
      for (const key of Object.keys(HABIT_DEFS)) {
        if (!isHabitDone(key, dayData)) {
          toggleHabit(key);
          break;
        }
      }
      return;
    }

    // Arrow keys: navigate days
    if (e.key === 'ArrowLeft') {
      selectedDate = jalali.addDays(selectedDate, 1);
      renderAll();
      return;
    }
    if (e.key === 'ArrowRight') {
      selectedDate = jalali.addDays(selectedDate, -1);
      renderAll();
      return;
    }
  });

  // Click outside modal to close
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  // Phase 3: Smart Toasts - time-based contextual messages
  smartToast('morning');
  smartToast('exercise');
  smartToast('sleep');
  smartToast('water');
  } catch(e) { console.error('Life Assist init error:',e);var _e=document.getElementById('js-error');if(_e){_e.style.display='block';var _m=document.getElementById('js-error-msg');if(_m)_m.textContent=e.message;}}
}
